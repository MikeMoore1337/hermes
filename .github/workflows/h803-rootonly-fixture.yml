name: H803 production-like root-only pin test (temporary)
on:
  push:
    branches: [fix/h803-h454-pin-fixture-release]
permissions:
  contents: read
jobs:
  synthetic-protected-h454-pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Exact branch checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Pinned production Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reproduce protected root-owned path without production data
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d -o root -g root -m 0700 /var/lib/hermes-h454-wss-sidecar
          sudo install -o root -g root -m 0600 /dev/null /var/lib/hermes-h454-wss-sidecar/stage1-original-pins.json
          python - <<'PY'
          from pathlib import Path
          path = Path("/var/lib/hermes-h454-wss-sidecar/stage1-original-pins.json")
          try:
              path.exists()
          except PermissionError:
              print("H803_ROOT_ONLY_PATH_PERMISSION_DENIED=PASS")
          else:
              raise SystemExit("H803_ROOT_ONLY_PATH_NOT_PROTECTED")
          PY
      - name: Run all native H454 unit tests without accessing protected pin
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_h454_stage1_pair_cutover -v
          echo "H803_PROTECTED_FIXTURE_ALL_H454_TESTS=PASS" >> "$GITHUB_STEP_SUMMARY"
