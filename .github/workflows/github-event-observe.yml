name: Hermes GitHub event observe (no executor)

# Only GitHub-generated enums and numeric object IDs. No user-supplied strings.
run-name: >-
  observe:${{ github.event_name }}:${{ github.event.action }}:${{ github.event.issue.number || github.event.pull_request.number || github.event.workflow_run.id || 0 }}:${{ github.event.workflow_run.conclusion || 'none' }}:${{ github.run_id }}

# GitHub pushes event data to this job; no poller, paid API, token extension,
# daemon, scheduler or Hermes agent is started.
on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_run:
    workflows: ["Hermes repository checks"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  observe:
    if: github.repository == 'MikeMoore1337/hermes'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Checkout event-pinned trusted base commit, never a PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # For these event types github.sha is the default/base branch commit.
          # A moving ref: main can cause a false failure during an unrelated push.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify checked out event SHA
        shell: bash
        env:
          EVENT_MAIN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVENT_MAIN_SHA"

      - name: Observe event without creating tasks or changing privileges
        shell: bash
        run: |
          set -euo pipefail
          python3 -m qa_advisor.github_event_observe --observe --summary --event "$GITHUB_EVENT_NAME" | tee "$GITHUB_STEP_SUMMARY"
