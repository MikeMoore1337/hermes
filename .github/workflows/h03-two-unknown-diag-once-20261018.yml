name: H-03 diagnose two unknown Crossref DOI results (one shot)
on:
  push:
    branches: [audit/h03-two-unknown-diag-once-20261018]
    paths: ['.github/workflows/h03-two-unknown-diag-once-20261018.yml']
permissions:
  contents: read
jobs:
  read-only-diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout exact snapshot without retained token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Two bounded official Crossref GETs with sanitized error reason
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import time
          from research_scout.crossref_updates import inspect, UpdateLookupError
          allowed = {
              "update_doi_invalid", "update_dns_unavailable", "update_http_unavailable",
              "update_content_type_invalid", "update_encoding_invalid", "update_body_oversize",
              "update_network_or_tls_unavailable", "update_response_invalid", "update_duplicate_json_key",
              "update_json_invalid", "update_schema_invalid", "update_links_invalid",
              "update_type_invalid", "update_date_invalid", "update_duplicate_notice",
              "update_relation_mismatch", "update_incomplete_result",
          }
          dois = ("10.3390/nu18183049", "10.1002/ejsc.70246")
          for index, doi in enumerate(dois):
              if index:
                  time.sleep(1.5)
              try:
                  result = inspect(doi)
              except UpdateLookupError as exc:
                  result = {"doi": doi, "status": "UNKNOWN",
                            "error_code": str(exc) if str(exc) in allowed else "unknown_sanitized_error"}
              print("H03_DIAG=" + json.dumps(result, sort_keys=True))
          PY
