name: Hermes repository checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-and-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate repository baseline
        run: python3 scripts/validate_repo.py
      - name: Verify local policy index and canonical target files
        run: python3 scripts/check_policy_index.py
      - name: Verify local Markdown references (offline)
        run: python3 scripts/check_markdown_links.py
      - name: Unit tests and exact VPS success banner
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/hermes-unittest.log"
          # The pinned VPS receiver expects the literal unskipped success
          # banner. Catch optional-dependency skip regressions here.
          grep -Fxq 'OK' "$RUNNER_TEMP/hermes-unittest.log" || {
            echo "VPS unittest banner mismatch: required exact OK" >&2
            exit 1
          }
      - name: H-454 guarded BRC sandbox write contracts (Node, offline)
        run: node --test tests/h454_guarded_sandbox_write.test.mjs
      - name: H-19 synthetic AI policy fixtures (Node standard library; no LLM)
        run: node --test evals/promptfoo_offline/policy.test.cjs
      - name: H-19 adversarial trace verifier (40 pinned scenarios; no AI)
        shell: bash
        run: |
          python3 -m evals.promptfoo_offline.attack_suite --out "$RUNNER_TEMP/h19-attack-report.json"
          python3 -c 'import json,os; r=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"h19-attack-report.json"))); print("H-19 synthetic attacks:",r["counts"],"H-01 OS:",r["h01_os_enforcement"])' >> "$GITHUB_STEP_SUMMARY"
      - name: H-23 offline agent benchmark (16 pinned scenarios; no LLM)
        shell: bash
        run: |
          python3 -m hermes_benchmark validate
          python3 -m hermes_benchmark run --sha "$(git rev-parse HEAD)" --output "$RUNNER_TEMP/hermes-benchmark"
          cat "$RUNNER_TEMP/hermes-benchmark/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: H-26 nine synthetic tool-performance oracles (no LLM, no devices)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m hermes_toolperf --sha "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: H-480 pinned tool-call contract fixtures (offline, no devices)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m hermes_toolperf.call_cases >> "$GITHUB_STEP_SUMMARY"
      - name: H-464 pinned reviewed-plugin fixture (offline, no downloads)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m hermes_toolperf.plugin_cases >> "$GITHUB_STEP_SUMMARY"
      - name: H-29 structured context-retention eval (nine synthetic histories; no LLM)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m hermes_context_eval.core --sha "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: H-477 ten bounded offline reasoning-state oracles (no LLM/devices)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m hermes_reasoning_eval.core --sha "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: H-476 pinned A/B/AB decisions (synthetic, no model or device)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m hermes_decision_eval.core --sha "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: H-28 offline self-evolution regression (three synthetic read-only descriptions)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m hermes_skill_delta.core --sha "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: H-30 isolated SQLite FTS5 synthetic metadata benchmark (no services)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m hermes_metadata_fts.benchmark >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve sanitized benchmark reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hermes-offline-benchmark
          path: |
            ${{ runner.temp }}/hermes-benchmark/report.json
            ${{ runner.temp }}/hermes-benchmark/summary.md
          retention-days: 7
      - name: Preserve H-19 sanitized attack report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hermes-h19-offline-attacks
          path: ${{ runner.temp }}/h19-attack-report.json
          retention-days: 7

  gsc-dependency-audit:
    # H-761: ephemeral GitHub runner only; no VPS, OAuth, Google API or secrets.
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact head without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Python 3.14 for GSC compatibility
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.14"
      - name: Install GSC dependencies in isolated venv and check resolver
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/gsc-audit-runtime"
          "$RUNNER_TEMP/gsc-audit-runtime/bin/python" -m pip install --no-input --disable-pip-version-check -r deploy/requirements-gsc-readonly.txt
          "$RUNNER_TEMP/gsc-audit-runtime/bin/python" -m pip check
          "$RUNNER_TEMP/gsc-audit-runtime/bin/python" -c 'import google.auth, requests; assert requests.__version__ == "2.33.0"; print("GSC_PYTHON_314_IMPORT=PASS")'
      - name: Audit direct and transitive GSC dependency graph
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/gsc-audit-scanner"
          "$RUNNER_TEMP/gsc-audit-scanner/bin/python" -m pip install --no-input --disable-pip-version-check pip-audit==2.10.1
          "$RUNNER_TEMP/gsc-audit-scanner/bin/pip-audit" --progress-spinner off -r deploy/requirements-gsc-readonly.txt
