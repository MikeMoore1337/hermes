name: H454 SignPath release gates (UNSIGNED refusal only, no signing)

on:
  pull_request:
    paths:
      - scripts/h454_verify_signed_windows_msi.ps1
      - .github/workflows/h454-native-win32-signpath-release.yml
      - .github/workflows/h454-signpath-release-contract.yml
      - docs/operations/h454-signpath-windows-release.md
      - tests/test_h454_signpath_release.py

permissions:
  contents: read

jobs:
  refuse-unsigned:
    runs-on: windows-2025
    timeout-minutes: 6
    steps:
      - name: Checkout source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Static release policy and signer prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B -m unittest -v tests.test_h454_signpath_release
          if ($LASTEXITCODE -ne 0) { throw 'H454_SIGNPATH_CONTRACT=FAIL' }
      - name: Parse real Windows PowerShell script and reject unsigned synthetic file
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'scripts/h454_verify_signed_windows_msi.ps1'
          $tokens = $null
          $errorsFound = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $path).Path, [ref]$tokens, [ref]$errorsFound)
          if (@($errorsFound).Count -ne 0) { throw 'H454_SIGNPATH_PARSE=FAIL' }
          $fake = Join-Path $env:RUNNER_TEMP 'h454-unsigned-synthetic.msi'
          if (Test-Path -LiteralPath $fake) { throw 'H454_SIGNPATH_TEST_COLLISION' }
          [IO.File]::WriteAllText($fake,'NOT_A_SIGNED_MSI',[Text.Encoding]::ASCII)
          $output = Join-Path $env:RUNNER_TEMP 'h454-no-extract'
          $pwsh = (Get-Process -Id $PID).Path
          $run = Start-Process -FilePath $pwsh -ArgumentList @(
            '-NoProfile','-NonInteractive','-File',
            $path,'-MsiPath',$fake,
            '-ExpectedSha',$env:GITHUB_SHA,
            '-OutputDir',$output
          ) -PassThru -Wait -NoNewWindow
          if ($run.ExitCode -ne 2 -or
              (Test-Path -LiteralPath $output)) {
            throw 'H454_SIGNPATH_UNSIGNED_MSI_ACCEPTED'
          }
          Write-Output 'H454_SIGNPATH_UNSIGNED_MSI=DENIED'
          Write-Output 'H454_SIGNPATH_EXTERNAL_REQUEST=NOT_RUN'
          Write-Output 'H454_OWNER_WINDOWS_HOST=NOT_RUN'
