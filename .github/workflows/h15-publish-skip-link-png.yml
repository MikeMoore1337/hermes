name: H15 temporary publish six PNG screenshots #179

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/h15-publish-skip-link-png.yml"

permissions:
  contents: read

jobs:
  publish-png:
    # Owner's same-repo PR only. This write-scoped workflow is deleted after publication.
    if: >-
      github.event.pull_request.number == 382 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'design/h15-179-skip-link-review-20261019' &&
      github.actor == 'MikeMoore1337'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout exact verified screenshot PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Download exact completed UI CI screenshot artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/h15-png"
          gh run download 39171520731 \
            --repo "$GITHUB_REPOSITORY" \
            --name h15-skip-link-keyboard-before-after \
            --dir "$RUNNER_TEMP/h15-png"
      - name: Verify six named PNGs, commit to review branch only
        shell: bash
        run: |
          set -euo pipefail
          ref="refs/heads/design/h15-179-skip-link-review-20261019"
          current="$(git ls-remote origin "$ref" | cut -f1)"
          [[ "$(git rev-parse HEAD)" == "$current" ]] || {
            echo "Feature branch moved: refusing stale image commit"
            exit 1
          }
          source="$RUNNER_TEMP/h15-png"
          dest="docs/ux/evidence/h15-skip-link"
          mkdir -p "$dest"
          mapfile -t images < <(find "$source" -type f -name '*.png' | sort)
          [[ "${#images[@]}" -eq 6 ]] || {
            echo "Expected exactly six PNGs, got ${#images[@]}"
            exit 1
          }
          for suffix in 320 393 1440; do
            for prefix in before after-focus; do
              filename="$prefix-$suffix.png"
              sourcefile="$(find "$source" -type f -name "$filename" -print -quit)"
              [[ -n "$sourcefile" && -s "$sourcefile" ]] || {
                echo "Missing or empty: $filename"
                exit 1
              }
              cp "$sourcefile" "$dest/$filename"
            done
          done
          git add -- "$dest/before-320.png" "$dest/before-393.png" \
            "$dest/before-1440.png" "$dest/after-focus-320.png" \
            "$dest/after-focus-393.png" "$dest/after-focus-1440.png"
          git diff --cached --name-only
          git diff --cached --quiet && {
            echo "All six PNGs already published"
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(h15): publish six direct-viewable skip-link screenshot PNGs (#179)"
          git push origin "HEAD:$ref"
