name: H454 paired native audit setup (synthetic only)

on:
  pull_request:
    paths:
      - 'scripts/h454_native_audit_setup.py'
      - 'scripts/h454_native_paired_*.py'
      - 'scripts/h454_native_linux_audit_unit.py'
      - 'tests/test_h454_native_audit_setup.py'
      - 'tests/h454_native_audit_setup_integration.py'
      - 'tests/test_h454_native_paired_*.py'
      - '.github/workflows/h454-native-paired-audit.yml'

permissions:
  contents: read

jobs:
  audit-and-paired-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run synthetic paired and audit contracts
        run: |
          python3 -B -m unittest -v tests.test_h454_native_audit_setup tests.test_h454_native_paired_host tests.test_h454_native_paired_rebind tests.test_h454_native_paired_launcher
      - name: Exercise root-owned temporary objects and rollback
        run: sudo -n env PYTHONPATH="$PWD" python3 -B -m unittest -v tests.h454_native_audit_setup_integration
