name: H445 owner Windows Docker inventory (synthetic only)

on:
  pull_request:
    paths:
      - scripts/h445_windows_docker_inventory.ps1
      - scripts/h445_windows_docker_capacity.ps1
      - scripts/h445_windows_task_launcher_preflight.ps1
      - scripts/h445_windows_disposable_init_trial.ps1
      - scripts/h445_windows_local_rollback_snapshot.ps1
      - scripts/h445_windows_restore_readiness.ps1
      - scripts/h445_windows_init_cutover_preflight.ps1
      - scripts/h445_windows_launcher_sites_inventory.ps1
      - tests/test_h445_windows_launcher_sites_inventory.py
      - tests/test_h445_windows_init_cutover_preflight.py
      - tests/test_h445_windows_restore_readiness.py
      - tests/test_h445_windows_local_rollback_snapshot.py
      - tests/test_h445_windows_disposable_init_trial.py
      - tests/test_h445_windows_task_launcher_preflight.py
      - tests/test_h445_windows_docker_capacity.py
      - tests/test_h445_windows_docker_inventory.py
      - docs/operations/h445-windows-docker-host-inventory.md
      - .github/workflows/h445-windows-docker-inventory.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-host-inventory:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2022
    timeout-minutes: 6
    steps:
      - name: Checkout exact PR source without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Parse Windows PowerShell and deny unvalidated container identifiers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/h445_windows_docker_inventory.ps1'
          $tokens = $null
          $parseErrors = $null
          $ast = [Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$parseErrors)
          if (@($parseErrors).Count -ne 0) { throw 'H445_INVENTORY_PARSER_FAILED' }
          # Execute ONLY the extracted pure normalization function against
          # synthetic Docker template results. Do not call Docker or the script.
          $funcs = @($ast.FindAll({
            param($node)
            $node -is [Management.Automation.Language.FunctionDefinitionAst] -and
              $node.Name -eq 'Normalize-InitValue'
          }, $true))
          if ($funcs.Count -ne 1) { throw 'H445_INIT_NORMALIZER_NOT_FOUND' }
          . ([scriptblock]::Create($funcs[0].Extent.Text))
          foreach ($case in @(
            @{ Raw=@('true'); Expected='true' },
            @{ Raw=@('false'); Expected='false' },
            @{ Raw=@(); Expected='UNAVAILABLE' },
            @{ Raw=@('<nil>'); Expected='UNAVAILABLE' },
            @{ Raw=@('<no value>'); Expected='UNAVAILABLE' },
            @{ Raw=@('garbage'); Expected='UNAVAILABLE' },
            @{ Raw=@('true','false'); Expected='UNAVAILABLE' }
          )) {
            $actual = Normalize-InitValue -Raw ([object[]]$case.Raw)
            if ($actual -cne $case.Expected) { throw 'H445_INIT_NORMALIZER_CASE_FAILED' }
          }
          Write-Output 'H445_MISSING_INIT_NORMALIZATION=PASS'

          # This MUST fail before any Docker binary/file IO is attempted.
          # Use PS 5.1 as on the owner host, without passing a valid container ID.
          $result = @(& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $script -Mode Inspect -ContainerId 'INVALID')
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 2 -or
              ($result -join ';') -notmatch 'H445_REASON=H445_FULL_CONTAINER_ID_REQUIRED' -or
              ($result -join ';') -notmatch 'H445_HOST_INVENTORY=HOLD') {
              throw 'H445_INVALID_ID_NOT_DENIED'
          }
          Write-Output 'H445_WINDOWS_PS_PARSER=PASS'
          Write-Output 'H445_INVALID_HOST_ID_DENIED=PASS'
          $global:LASTEXITCODE = 0
      - name: Source-only security contracts
        shell: pwsh
        run: |
          python -B -m unittest -v tests.test_h445_windows_docker_inventory
          if ($LASTEXITCODE -ne 0) { throw 'H445_INVENTORY_CONTRACT_FAIL' }
          Write-Output 'H445_INVENTORY_SOURCE_CONTRACTS=PASS'

      - name: Static PID-capacity diagnostic parser and synthetic ps fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/h445_windows_docker_capacity.ps1'
          $tokens = $null
          $parseErrors = $null
          $ast = [Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$parseErrors)
          if (@($parseErrors).Count -ne 0) { throw 'H445_CAPACITY_PS_PARSE_FAILED' }
          $funcs = @($ast.FindAll({
            param($node)
            $node -is [Management.Automation.Language.FunctionDefinitionAst] -and
              $node.Name -eq 'Top-Summary'
          }, $true))
          if ($funcs.Count -ne 1) { throw 'H445_CAPACITY_PARSER_MISSING' }
          . ([scriptblock]::Create($funcs[0].Extent.Text))
          $good = Top-Summary -Lines ([string[]]@('PID PPID STAT','100 1 Ss','101 1 Z','102 100 Sl'))
          if ($good.process_state_status -ne 'OBSERVED_WITHOUT_PID1_ATTRIBUTION' -or
              $good.visible_zombies -ne 1 -or $good.process_rows -ne 3) {
              throw 'H445_CAPACITY_SYNTHETIC_GOOD_FAILED'
          }
          foreach ($bad in @(
            ([string[]]@('STAT','Z')),
            ([string[]]@('PID PPID STAT','123 malformed')),
            ([string[]]@('PID PPID STAT')),
            ([string[]]@('PID PPID STAT','1 2 Z credential')),
            ([string[]]@('PID PPID STAT','oops 1 Z'))
          )) {
            $result = Top-Summary -Lines ([string[]]$bad)
            if ($result.process_state_status -ne 'NOT_VERIFIED' -or
                $null -ne $result.visible_zombies -or
                $null -ne $result.process_rows) {
                throw 'H445_CAPACITY_SYNTHETIC_BAD_NOT_DENIED'
            }
          }
          python -B -m unittest -v tests.test_h445_windows_docker_capacity
          if ($LASTEXITCODE -ne 0) { throw 'H445_CAPACITY_SOURCE_CONTRACTS_FAILED' }
          Write-Output 'H445_CAPACITY_PS_PARSER=PASS'
          Write-Output 'H445_CAPACITY_PID_HEADER_GUARD=PASS'
          Write-Output 'H445_CAPACITY_SOURCE_CONTRACTS=PASS'

      - name: Synthetic scheduled task launcher parsing without host access
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/h445_windows_task_launcher_preflight.ps1'
          $tokens = $null
          $errors = $null
          $ast = [Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors)
          if (@($errors).Count -ne 0) { throw 'H445_TASK_PREFLIGHT_PARSE_FAILED' }
          $f = @($ast.FindAll({
            param($n)
            $n -is [Management.Automation.Language.FunctionDefinitionAst] -and
              $n.Name -eq 'Get-FileArgument'
          }, $true))
          if ($f.Count -ne 1) { throw 'H445_FILE_ARGUMENT_FUNCTION_NOT_FOUND' }
          . ([scriptblock]::Create($f[0].Extent.Text))
          $samples = @(
            @{ Args='-NoProfile -File "C:\Hermes Test\launch.ps1" -Target hermes-h15-windows-permanent'; Expected='C:\Hermes Test\launch.ps1' },
            @{ Args='-NoProfile -File C:\Hermes\launch.ps1'; Expected='C:\Hermes\launch.ps1' },
            @{ Args='-NoProfile -Command "do things"'; Expected=$null },
            @{ Args='-EncodedCommand AAA'; Expected=$null },
            @{ Args='-NoProfile'; Expected=$null }
          )
          foreach ($sample in $samples) {
            $actual = Get-FileArgument -Arguments $sample.Args
            if ($actual -cne $sample.Expected) { throw 'H445_FILE_ARGUMENT_CASE_FAILED' }
          }
          python -B -m unittest -v tests.test_h445_windows_task_launcher_preflight
          if ($LASTEXITCODE -ne 0) { throw 'H445_TASK_PREFLIGHT_SOURCE_CONTRACTS_FAILED' }
          Write-Output 'H445_TASK_LAUNCHER_PARSER=PASS'
          Write-Output 'H445_TASK_LAUNCHER_SOURCE_CONTRACTS=PASS'

      - name: Offline owner gate for disposable PID1 trial
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/h445_windows_disposable_init_trial.ps1'
          $tokens = $null
          $parseErrors = $null
          [Management.Automation.Language.Parser]::ParseFile($script,[ref]$tokens,[ref]$parseErrors) | Out-Null
          if (@($parseErrors).Count -ne 0) { throw 'H445_DISPOSABLE_PS_PARSE_FAILED' }
          python -B -m unittest -v tests.test_h445_windows_disposable_init_trial
          if ($LASTEXITCODE -ne 0) { throw 'H445_DISPOSABLE_SOURCE_CONTRACT_FAILED' }
          # Do not execute script or connect Docker in CI. Explicit host
          # approval is a separate step, not implicit in a green PR.
          Write-Output 'H445_DISPOSABLE_SOURCE_PARSER=PASS'
          Write-Output 'H445_DISPOSABLE_HOST_RUNTIME=NOT_EXECUTED'

      - name: Local-only protected rollback preflight parser and source contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/h445_windows_local_rollback_snapshot.ps1'
          $tokens = $null
          $parseErrors = $null
          $ast = [Management.Automation.Language.Parser]::ParseFile(
            $script, [ref]$tokens, [ref]$parseErrors)
          if (@($parseErrors).Count -ne 0) { throw 'H445_BACKUP_POWERSHELL_PARSE_FAILED' }
          $funcs = @($ast.FindAll({
            param($node)
            $node -is [Management.Automation.Language.FunctionDefinitionAst] -and
              $node.Name -eq 'Get-LauncherPath'
          }, $true))
          if ($funcs.Count -ne 1) { throw 'H445_BACKUP_LAUNCHER_PARSER_NOT_FOUND' }
          . ([scriptblock]::Create($funcs[0].Extent.Text))
          $cases = @(
            @{ Text='-NoProfile -File "C:\Test Data\launcher.ps1"'; Value='C:\Test Data\launcher.ps1' },
            @{ Text='-File C:\Test\launcher.ps1'; Value='C:\Test\launcher.ps1' },
            @{ Text='-Command "hello"'; Value=$null },
            @{ Text='-EncodedCommand AAAA'; Value=$null },
            @{ Text='-NoProfile'; Value=$null }
          )
          foreach ($case in $cases) {
            if ((Get-LauncherPath -Arguments $case.Text) -cne $case.Value) {
              throw 'H445_BACKUP_LAUNCHER_PARSER_CASE_FAILED'
            }
          }
          $aclFns = @($ast.FindAll({
            param($node)
            $node -is [Management.Automation.Language.FunctionDefinitionAst] -and
              $node.Name -eq 'Protected-Directory'
          }, $true))
          if ($aclFns.Count -ne 1) { throw 'H445_PROTECTED_DIR_FUNCTION_NOT_FOUND' }
          . ([scriptblock]::Create($aclFns[0].Extent.Text))
          $testDir = Join-Path $env:RUNNER_TEMP ('h445-acl-' + [guid]::NewGuid().ToString('N'))
          try {
            Protected-Directory -Location $testDir
            $actualAcl = Get-Acl -LiteralPath $testDir
            if (-not $actualAcl.AreAccessRulesProtected) {
              throw 'H445_ACL_INHERITANCE_NOT_DISABLED'
            }
            $allowed = @(
              [Security.Principal.WindowsIdentity]::GetCurrent().User.Value,
              'S-1-5-18', 'S-1-5-32-544'
            )
            foreach ($entry in $actualAcl.Access) {
              $sid = $entry.IdentityReference.Translate(
                [Security.Principal.SecurityIdentifier]).Value
              if ($sid -notin $allowed) { throw 'H445_ACL_UNEXPECTED_IDENTITY' }
            }
          } finally {
            if ([IO.Directory]::Exists($testDir)) {
              [IO.Directory]::Delete($testDir)
            }
          }
          Write-Output 'H445_BACKUP_SYNTHETIC_ACL=PASS'
          python -B -m unittest -v tests.test_h445_windows_local_rollback_snapshot
          if ($LASTEXITCODE -ne 0) { throw 'H445_BACKUP_SOURCE_CONTRACT_FAILED' }
          Write-Output 'H445_BACKUP_POWERSHELL_AST=PASS'
          Write-Output 'H445_BACKUP_SOURCE_ONLY=PASS'
          Write-Output 'H445_BACKUP_OWNER_HOST_NOT_TOUCHED=TRUE'

      - name: Synthetic read-only restore evidence parser and contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/h445_windows_restore_readiness.ps1'
          $tokens = $null
          $parseErrors = $null
          $ast = [Management.Automation.Language.Parser]::ParseFile(
            $script, [ref]$tokens, [ref]$parseErrors)
          if (@($parseErrors).Count -ne 0) { throw 'H445_RESTORE_READINESS_PARSE_FAILED' }
          $f = @($ast.FindAll({
            param($n)
            $n -is [Management.Automation.Language.FunctionDefinitionAst] -and
              $n.Name -eq 'Compare-Section'
          }, $true))
          if ($f.Count -ne 1) { throw 'H445_COMPARE_SECTION_NOT_FOUND' }
          . ([scriptblock]::Create($f[0].Extent.Text))
          $a = [pscustomobject]@{ Config = [pscustomobject]@{ User = '65534:65534' } }
          $b = [pscustomobject]@{ Config = [pscustomobject]@{ User = '65534:65534' } }
          Compare-Section $a $b 'Config'
          $b.Config.User = 'root'
          $denied = $false
          try { Compare-Section $a $b 'Config' } catch { $denied = $true }
          if (-not $denied) { throw 'H445_CONFIG_DRIFT_NOT_DENIED' }
          python -B -m unittest -v tests.test_h445_windows_restore_readiness
          if ($LASTEXITCODE -ne 0) { throw 'H445_RESTORE_SOURCE_CONTRACT_FAILED' }
          Write-Output 'H445_RESTORE_READINESS_AST=PASS'
          Write-Output 'H445_RESTORE_DRIFT_DENIAL=PASS'
          Write-Output 'H445_OWNER_PRIVATE_DATA_ACCESSED=FALSE'

      - name: Parse owner init cutover gate and test synthetic launcher AST
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/h445_windows_init_cutover_preflight.ps1'
          $tokens = $null
          $errors = $null
          $ast = [Management.Automation.Language.Parser]::ParseFile(
            $script, [ref]$tokens, [ref]$errors)
          if (@($errors).Count -ne 0) { throw 'H445_INIT_CUTOVER_PARSE_FAILED' }
          $funcs = @($ast.FindAll({
            param($node)
            $node -is [Management.Automation.Language.FunctionDefinitionAst] -and
              $node.Name -eq 'Inspect-RunStructure'
          }, $true))
          if ($funcs.Count -ne 1) { throw 'H445_INIT_AST_FUNCTION_MISSING' }
          . ([scriptblock]::Create($funcs[0].Extent.Text))
          $classes = @($ast.FindAll({
            param($node)
            $node -is [Management.Automation.Language.FunctionDefinitionAst] -and
              $node.Name -eq 'Site-Class'
          }, $true))
          if ($classes.Count -ne 1) { throw 'H445_BOUNDED_ENUM_FUNCTION_MISSING' }
          . ([scriptblock]::Create($classes[0].Extent.Text))
          $one = Inspect-RunStructure -Source '& $docker run --pids-limit 96 @opts'
          if ($one.DockerRunSites -ne 1 -or $one.LiteralInitTokens -ne 0) {
            throw 'H445_INIT_ONE_RUN_NOT_RECOGNIZED'
          }
          $two = Inspect-RunStructure -Source "docker run --init testimage`ndocker run testimage"
          if ($two.DockerRunSites -ne 2 -or $two.LiteralInitTokens -ne 1) {
            throw 'H445_INIT_MULTIPLE_RUN_NOT_RECOGNIZED'
          }
          $indirect = Inspect-RunStructure -Source '& $docker @dockerArgs'
          if ($indirect.DockerRunSites -ne 0 -or
              $indirect.DockerIndirectCalls -ne 1 -or
              $indirect.DockerLikeCalls -ne 1) {
            throw 'H445_INIT_INDIRECT_DOCKER_NOT_CLASSIFIED'
          }
          $named = Inspect-RunStructure -Source '& $dockerExe @dockerArgs'
          if ($named.DockerRunSites -ne 0 -or $named.DockerIndirectCalls -ne 1) {
            throw 'H445_INIT_NAMED_DOCKER_WRAPPER_NOT_CLASSIFIED'
          }
          $literal = Inspect-RunStructure -Source 'docker run --init testimage'
          if ($literal.DockerRunSites -ne 1 -or $literal.LiteralInitTokens -ne 1) {
            throw 'H445_INIT_LITERAL_FLAG_NOT_RECOGNIZED'
          }
          if ((Site-Class 0) -cne 'ZERO' -or (Site-Class 1) -cne 'ONE' -or
              (Site-Class 99) -cne 'MULTIPLE') {
            throw 'H445_INIT_BOUNDED_RECEIPT_CLASS_FAILED'
          }
          $comment = Inspect-RunStructure -Source "# docker run fake`nWrite-Output test"
          if ($comment.DockerRunSites -ne 0) { throw 'H445_INIT_COMMENT_FALSE_POSITIVE' }
          $parseDenied = $false
          try { Inspect-RunStructure -Source 'function {' | Out-Null } catch {
            $parseDenied = $true
          }
          if (-not $parseDenied) { throw 'H445_INIT_BROKEN_SCRIPT_NOT_DENIED' }
          python -B -m unittest -v tests.test_h445_windows_init_cutover_preflight
          if ($LASTEXITCODE -ne 0) { throw 'H445_INIT_CUTOVER_CONTRACT_FAILED' }
          Write-Output 'H445_INIT_CUTOVER_STATIC_AST=PASS'
          Write-Output 'H445_INIT_CUTOVER_HOST_EXECUTION=NOT_RUN'

      - name: Offline private launcher multi-site PowerShell AST inventory tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/h445_windows_launcher_sites_inventory.ps1'
          $tokens = $null
          $errors = $null
          $ast = [Management.Automation.Language.Parser]::ParseFile(
            $script, [ref]$tokens, [ref]$errors)
          if (@($errors).Count -ne 0) { throw 'H445_SITE_PS_PARSE_FAILED' }
          foreach ($fnName in @('Flag-Value', 'Parent-Has', 'Nearest-If', 'If-Arm', 'If-Relation', 'Find-RunSites', 'Count-Class')) {
            $matching = @($ast.FindAll({
              param($n)
              $n -is [Management.Automation.Language.FunctionDefinitionAst] -and
                $n.Name -ceq $fnName
            }, $true))
            if ($matching.Count -ne 1) { throw 'H445_PURE_AST_FUNCTION_MISSING' }
            . ([scriptblock]::Create($matching[0].Extent.Text))
          }
          $single = Find-RunSites -Source '& $docker run --name test --network none -v /w:/w -e A=x --init --rm $image'
          if ($single.Sites.Count -ne 1 -or $single.Sites[0].Name -cne 'YES' -or
              $single.Sites[0].Mount -cne 'YES' -or
              $single.Sites[0].Environment -cne 'YES' -or
              $single.Sites[0].Network -cne 'YES' -or
              $single.Sites[0].Init -cne 'YES' -or
              $single.Sites[0].Remove -cne 'YES' -or
              $single.Sites[0].VariableArgument -cne 'YES' -or
              $single.Sites[0].Context -cne 'TOP_LEVEL') {
            throw 'H445_SITE_SINGLE_FLAGS_FAILED'
          }
          $multiple = Find-RunSites -Source 'function Go { if ($true) { & $docker run --name a $img } }; docker inspect a; docker run --network none img'
          if ($multiple.Sites.Count -ne 2 -or
              $multiple.OtherDockerCalls -ne 1 -or
              $multiple.Sites[0].Context -cne 'FUNCTION' -or
              $multiple.Sites[0].Conditional -cne 'YES' -or
              $multiple.Sites[1].Context -cne 'TOP_LEVEL') {
            throw 'H445_SITE_MULTIPLE_CONTEXT_FAILED'
          }
          $exclusive = Find-RunSites -Source 'if ($flag) { docker run --name x img } else { docker run --name y img }'
          if ($exclusive.Relation -cne 'EXCLUSIVE_IF_ARMS' -or
              $exclusive.Sites[0].NearestIf -cne 'YES' -or
              $exclusive.Sites[1].NearestIf -cne 'YES') {
            throw 'H445_RUN_SITES_EXCLUSIVE_IF_FAILED'
          }
          $elseif = Find-RunSites -Source 'if ($flag) { docker run img } elseif ($other) { docker run img }'
          if ($elseif.Relation -cne 'EXCLUSIVE_IF_ARMS') {
            throw 'H445_RUN_SITES_ELSEIF_FAILED'
          }
          $same = Find-RunSites -Source 'if ($flag) { docker run img; docker run img }'
          if ($same.Relation -cne 'SAME_IF_ARM') {
            throw 'H445_RUN_SITES_SAME_ARM_FAILED'
          }
          $separate = Find-RunSites -Source 'if ($flag) { docker run img }; if ($other) { docker run img }'
          if ($separate.Relation -cne 'DIFFERENT_NEAREST_IF') {
            throw 'H445_RUN_SITES_DIFFERENT_IF_FAILED'
          }
          $top = Find-RunSites -Source 'docker run img; docker run img'
          if ($top.Relation -cne 'UNKNOWN' -or
              $top.Sites[0].NearestIf -cne 'NO') {
            throw 'H445_RUN_SITES_TOP_LEVEL_UNCERTAINTY_FAILED'
          }
          $splat = Find-RunSites -Source '& $docker run @args'
          if ($splat.Sites.Count -ne 1 -or $splat.Sites[0].Splat -cne 'YES') {
            throw 'H445_SITE_SPLAT_FAILED'
          }
          $comment = Find-RunSites -Source "# docker run fake" 
          if ($comment.Sites.Count -ne 0) { throw 'H445_SITE_COMMENT_FALSE_POSITIVE' }
          $bad = $false
          try { Find-RunSites -Source 'function {' | Out-Null } catch { $bad=$true }
          if (-not $bad) { throw 'H445_SITE_SYNTAX_ERROR_NOT_DENIED' }
          python -B -m unittest -v tests.test_h445_windows_launcher_sites_inventory
          if ($LASTEXITCODE -ne 0) { throw 'H445_SITE_CONTRACTS_FAILED' }
          Write-Output 'H445_LAUNCHER_SITES_SYNTHETIC_AST=PASS'
          Write-Output 'H445_LAUNCHER_SITES_PRIVATE_HOST_EXECUTION=NOT_RUN'
