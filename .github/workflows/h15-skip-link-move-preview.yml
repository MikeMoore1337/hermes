name: H15 #179 temporary focused skip-link screenshot refresh

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/h15-skip-link-move-preview.yml"

permissions:
  contents: read

jobs:
  rebuild-and-publish:
    if: >-
      github.event.pull_request.number == 382 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'design/h15-179-skip-link-review-20261019' &&
      github.actor == 'MikeMoore1337'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    permissions:
      contents: write
    steps:
      - name: Checkout exact review-branch commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Use pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: control_center/frontend/package-lock.json
      - name: Install exact lockfile without lifecycle scripts
        working-directory: control_center/frontend
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Compile checked-in frontend
        working-directory: control_center/frontend
        run: npm run build
      - name: Install Chromium locally
        working-directory: control_center/frontend
        run: npx playwright install --with-deps chromium
      - name: Verify no logo/header obstruction and create 320/393/1440 PNGs
        working-directory: control_center/frontend
        run: npx playwright test qa/skip-link.spec.js
      - name: Publish only static bundle and six reviewed PNGs in feature branch
        shell: bash
        run: |
          set -euo pipefail
          ref="refs/heads/design/h15-179-skip-link-review-20261019"
          current="$(git ls-remote origin "$ref" | cut -f1)"
          [[ "$(git rev-parse HEAD)" == "$current" ]] || {
            echo "Ref moved; refusing to publish stale assets"
            exit 1
          }
          dest="docs/ux/evidence/h15-skip-link"
          for size in 320 393 1440; do
            for prefix in before after-focus; do
              file="$dest/$prefix-$size.png"
              [[ -s "$file" ]] || { echo "Missing image $file"; exit 1; }
            done
          done
          git add -- control_center/web "$dest"
          allowed='^(control_center/web/|docs/ux/evidence/h15-skip-link/(before|after-focus)-(320|393|1440)\.png$)'
          if git diff --cached --name-only | grep -Ev "$allowed"; then
            echo "Unexpected staged files; aborting"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "NO_ASSET_CHANGES=true"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(h15): move skip-link above header and refresh six PNGs (#179)"
          git push origin "HEAD:$ref"
          echo "SCREENSHOTS_PUBLISHED=true"
