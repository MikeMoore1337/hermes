name: Hermes Control Center UI

on:
  pull_request:
    paths:
      - "control_center/**"
      - "tests/test_control_center*.py"
      - "tests/test_codex_usage.py"
      - "tests/test_codex_analytics*.py"
      - "tests/test_codex_policy_history.py"
      - "tests/test_control_center_pwa.py"
      - "tests/test_h15_oauth_egress_evidence.py"
      - "scripts/h15_oauth_egress_evidence.py"
      - "scripts/h15_caddy_callback_log_guard.py"
      # Match production-deploy SHA gate: any scripts/h15_* change requires UI CI.
      - "scripts/h15_*"
      - "tests/test_h15_caddy_callback_log_guard.py"
      - ".github/workflows/control-center-ui.yml"
  push:
    branches: [main]
    paths:
      - "control_center/**"
      - "tests/test_control_center*.py"
      - "tests/test_codex_usage.py"
      - "tests/test_codex_policy_history.py"
      - "tests/test_control_center_pwa.py"
      - "tests/test_h15_oauth_egress_evidence.py"
      - "scripts/h15_oauth_egress_evidence.py"
      - "scripts/h15_caddy_callback_log_guard.py"
      # Match production-deploy SHA gate: any scripts/h15_* change requires UI CI.
      - "scripts/h15_*"
      - "tests/test_h15_caddy_callback_log_guard.py"
      - ".github/workflows/control-center-ui.yml"

permissions:
  contents: read

jobs:
  ui-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: control_center/frontend/package-lock.json
      - name: Install pinned build dependencies without lifecycle scripts
        working-directory: control_center/frontend
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Verify JS, snapshot transforms and build
        working-directory: control_center/frontend
        run: |
          npm run check
          node --check public/ai-analytics.js
          node --check public/provider-quota.js
          npm run test
          npm run build
      - name: Compiled bundle matches committed source
        run: git diff --exit-code -- control_center/web
      - name: Production dependency vulnerability gate
        working-directory: control_center/frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Python allowlist/API/OAuth security regression tests
        run: python3 -m unittest tests.test_codex_usage tests.test_codex_analytics tests.test_codex_analytics_api tests.test_codex_policy_history tests.test_control_center tests.test_control_center_assets tests.test_control_center_oauth tests.test_control_center_broker tests.test_control_center_credentials tests.test_control_center_unix_http_integration -v
      - name: PWA manifest, SW and offline privacy tests
        run: python3 -m unittest tests.test_control_center_pwa -v
      - name: GitHub egress pin attestation negative tests
        run: python3 -m unittest tests.test_h15_oauth_egress_evidence -v
      - name: Caddy OAuth callback log policy regression tests
        run: python3 -m unittest tests.test_h15_caddy_callback_log_guard -v
      - name: Install Chromium for frontend end-to-end regression
        working-directory: control_center/frontend
        run: npx playwright install --with-deps chromium
      - name: Browser checks (approved Atlas, protected GitHub login, mobile)
        working-directory: control_center/frontend
        run: npm run test:e2e
      - name: Python per-provider, official Cloudflare billing and GitHub rate-limit contracts
        run: python3 -m unittest tests.test_provider_registry tests.test_cloudflare_billing tests.test_github_rate_limit tests.test_github_rate_history tests.test_provider_quota_ops_alerts -v

      - name: Attach #295 separate provider quota cards for visual approval
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: h15-provider-quota-cards-screenshots
          path: |
            docs/ux/evidence/h15-provider-registry/provider-cards-*.png
            docs/ux/evidence/h15-provider-registry/cloudflare-advisory-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Attach #294 separate VPS cards mobile/desktop evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: h15-infrastructure-cards-screenshots
          path: docs/ux/evidence/h15-infrastructure/infrastructure-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Attach H-15 scheduler visual evidence for owner review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: h15-codex-scheduler-screenshots
          path: docs/ux/evidence/h15-codex-scheduler/scheduler-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Attach #272 Atlas analytics desktop/mobile visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: h15-ai-usage-analytics-screenshots
          path: docs/ux/evidence/h15-ai-analytics/analytics-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Attach H-15 #179 skip-navigation keyboard evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: h15-skip-link-keyboard-before-after
          path: docs/ux/evidence/h15-skip-link/*.png
          if-no-files-found: ignore
          retention-days: 7
