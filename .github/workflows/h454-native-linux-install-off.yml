name: H454 Linux disabled native source install test (NO HOST)

on:
  pull_request:
    paths:
      - scripts/h454_native_linux_install_off.py
      - tests/test_h454_native_linux_install_off.py
      - docs/operations/h454-native-linux-install-off.md
      - .github/workflows/h454-native-linux-install-off.yml

permissions:
  contents: read

jobs:
  offline-native-install-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout without stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify source-only Linux install and rollback with synthetic files
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest -v tests.test_h454_native_linux_install_off
          echo 'H454_NATIVE_LINUX_INSTALL_OFF_CI=PASS'
          echo 'H454_OWNER_VPS_INSTALL=NOT_RUN'
          echo 'H454_NATIVE_DEVICE_ACTIVATION=NOT_RUN'
