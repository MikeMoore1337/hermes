name: H779 Impeccable native finish detector (temporary)
on:
  push:
    branches: [feat/h779-apple27-aero-glass]
permissions:
  contents: read
jobs:
  original-detector:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run upstream Impeccable at pinned commit
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/pbakaus/impeccable.git "$RUNNER_TEMP/impeccable"
          git -C "$RUNNER_TEMP/impeccable" checkout --detach 83dc1bbe4c37636632e72a7752e9cc433e9a9901
          test "$(git -C "$RUNNER_TEMP/impeccable" rev-parse HEAD)" = 83dc1bbe4c37636632e72a7752e9cc433e9a9901
          skill="$RUNNER_TEMP/impeccable/.agents/skills/impeccable/scripts/impeccable"
          export IMPECCABLE_HOME="$RUNNER_TEMP/impeccable-cache"
          cd control_center/frontend
          sh "$skill" engine-probe
          sh "$skill" context --target src/main.jsx
          set +e
          sh "$skill" detect --json src/apple27.css src/main.jsx src/OrbitOverview.jsx >"$RUNNER_TEMP/h779-detector.json" 2>"$RUNNER_TEMP/h779-detector.err"
          status=$?
          set -e
          echo "ORIGINAL=pbakaus/impeccable" >> "$GITHUB_STEP_SUMMARY"
          echo "UPSTREAM_SHA=83dc1bbe4c37636632e72a7752e9cc433e9a9901" >> "$GITHUB_STEP_SUMMARY"
          echo "EXACT_HERMES_SHA=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "NATIVE_DETECT_EXIT=$status" >> "$GITHUB_STEP_SUMMARY"
          head -c 9000 "$RUNNER_TEMP/h779-detector.json" || :
          head -c 1500 "$RUNNER_TEMP/h779-detector.err" || :
          mkdir -p .artifacts/h779-original-detector
          cp "$RUNNER_TEMP/h779-detector.json" .artifacts/h779-original-detector/findings.json
          cp "$RUNNER_TEMP/h779-detector.err" .artifacts/h779-original-detector/stderr.txt
          exit "$status"
      - name: Upload native detector receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h779-impeccable-native-detector
          path: control_center/frontend/.artifacts/h779-original-detector/
          retention-days: 7
          if-no-files-found: ignore
