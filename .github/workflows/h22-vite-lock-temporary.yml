name: H-22 temporary Vite lock regeneration

on:
  pull_request:
    branches: [main]
    paths:
      - control_center/frontend/package.json
      - .github/workflows/h22-vite-lock-temporary.yml

permissions:
  contents: read

jobs:
  generate-lock-and-bundle:
    if: github.head_ref == 'fix/h22-vite-7-3-7'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Regenerate Vite v7 lockfile using npm (read-only GitHub permissions)
        working-directory: control_center/frontend
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact --save-dev vite@7.3.7
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm run test
          npm run build
          node -e "const p=require('./package-lock.json');if(p.packages['node_modules/vite'].version!=='7.3.7')process.exit(1); console.log('VITE_LOCK_VERSION_VERIFIED=7.3.7')"
      - name: Emit changed public text files for controlled application via GitHub contents API
        run: |
          node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const paths = cp.execFileSync('git',['diff','--name-only','--','control_center/frontend/package-lock.json','control_center/web'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          if (!paths.includes('control_center/frontend/package-lock.json') || paths.length > 12) throw new Error('unexpected_output_paths');
          for (const path of paths) {
            if (!/^control_center\/(frontend\/package-lock\.json|web\/[a-zA-Z0-9_.-]+)$/.test(path)) throw new Error('forbidden_output_path');
            const bytes = fs.readFileSync(path);
            if (bytes.length > 600000 || bytes.includes(0)) throw new Error('unexpected_binary_or_size');
            const content = bytes.toString('utf8');
            console.log('H22_FILE_START:'+JSON.stringify(path));
            for (let i=0;i<content.length;i+=1500) console.log('H22_CHUNK:'+JSON.stringify(content.slice(i,i+1500)));
            console.log('H22_FILE_END:'+JSON.stringify(path));
          }
          console.log('H22_EMITTED_FILES='+paths.length);
          NODE
