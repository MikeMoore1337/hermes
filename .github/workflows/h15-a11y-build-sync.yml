name: H15 temporary same-repo build sync #179

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "control_center/frontend/src/**"
      - "control_center/frontend/qa/semantic-accessibility.spec.js"
      - ".github/workflows/h15-a11y-build-sync.yml"

permissions:
  contents: read

jobs:
  build-sync:
    # Temporary one-branch builder. Delete this workflow from PR before merge.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/h15-179-react-semantics-20261019'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact same-repository feature head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Set up pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: control_center/frontend/package-lock.json
      - name: Install exact lockfile without lifecycle scripts
        working-directory: control_center/frontend
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Rebuild deterministic committed frontend
        working-directory: control_center/frontend
        run: npm run build
      - name: Commit only generated static assets, fail closed on concurrent changes
        shell: bash
        run: |
          set -euo pipefail
          ref="refs/heads/fix/h15-179-react-semantics-20261019"
          current="$(git ls-remote origin "$ref" | cut -f1)"
          [[ "$(git rev-parse HEAD)" == "$current" ]] || {
            echo "Feature head moved; refusing to commit stale build"
            exit 1
          }
          git add -- control_center/web
          if git diff --cached --quiet; then
            echo "BUNDLE_ALREADY_SYNCED=true"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(h15): sync approved React table semantics output (#179)"
          git push origin "HEAD:$ref"
          echo "BUNDLE_COMMITTED=true"
