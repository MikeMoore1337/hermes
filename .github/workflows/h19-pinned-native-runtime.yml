name: H-19 pinned offline native probe

# Isolated, explicit opt-in. This does NOT run on normal main quality jobs.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/h19_v0222_native_evidence.py
      - scripts/h19_native_report_verify.py
      - scripts/h19_execve_seccomp_probe.py
      - scripts/h19_native_effect_canary.py
      - scripts/h19_real_stdio_mcp.py
      - scripts/h19_agent_fake_model_e2e.py
      - scripts/h19_agent_injection_matrix.py
      - scripts/h19_real_http_mcp.py
      - patches/upstream/hermes-v0.22.2-mcp-owner-readonly-policy.patch
      - docker/v0222-native-tool-policy-test/Dockerfile
      - tests/test_h19_real_http_mcp.py
      - tests/test_h19_agent_injection_matrix.py
      - tests/test_h19_agent_fake_model_e2e.py
      - tests/test_h19_real_stdio_mcp.py
      - tests/test_h19_native_effect_canary.py
      - tests/test_h19_execve_seccomp_probe.py
      - tests/test_h19_v0222_native_evidence.py
      - .github/workflows/h19-pinned-native-runtime.yml

permissions:
  contents: read

jobs:
  pinned-native:
    # Never accept code or image from an arbitrary fork in this isolated probe.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout proposed exact revision without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Pin and inspect immutable original image
        shell: bash
        run: |
          set -euo pipefail
          original='nousresearch/hermes-agent@sha256:a11574b7fe8e1631d7d88d556677dac693bc058abf558cdeb899155688c1bf05'
          docker pull --platform linux/amd64 "$original"
          docker image inspect "$original" --format '{{.Id}} {{.Architecture}}'
      - name: Build ephemeral patched candidate with no build network
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull=false --network none --platform linux/amd64 \
            --file docker/v0222-native-tool-policy-test/Dockerfile \
            --tag hermes-v0222-native-policy-candidate:20261016 .
      - name: Validate real pinned dispatcher with synthetic executors and OS sandbox
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.h19_v0222_native_evidence --execute --out "$RUNNER_TEMP/h19-native-report.json"
          python3 -c 'import json,os; r=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"h19-native-report.json"))); print("Native:",r["native_comparison_status"],"OS:",r["os_probe_status"],"model:",r["real_model_evaluation"])' >> "$GITHUB_STEP_SUMMARY"
      - name: Independent native receipt readback (fails closed)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.h19_native_report_verify "$RUNNER_TEMP/h19-native-report.json" --out "$RUNNER_TEMP/h19-native-readback.json"
          python3 -c 'import json,os; r=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"h19-native-readback.json"))); print("Native readback:",r["verification_status"],"OS shell:",r["shell_os_probe_result"],"full enforcement:",r["full_permission_enforcement"])' >> "$GITHUB_STEP_SUMMARY"
      - name: H-19 real Linux kernel process-local execve deny experiment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.h19_execve_seccomp_probe --execute --out "$RUNNER_TEMP/h19-execve-seccomp.json"
          python3 -c 'import json,os; r=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"h19-execve-seccomp.json"))); print("Seccomp process-local:",r["status"],"H-01 OS:",r["full_agent_os_enforcement"],"LLM:",r["live_model"])' >> "$GITHUB_STEP_SUMMARY"
      - name: Actual pinned native dispatcher with disposable tmpfs side-effect canaries
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.h19_native_effect_canary --execute --out "$RUNNER_TEMP/h19-native-effects.json"
          python3 -c 'import json,os; r=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"h19-native-effects.json"))); print("Native intercepted effects:",r["status"],"cases:",r["scenario_count"],"actual MCP:",r["real_mcp_called"])' >> "$GITHUB_STEP_SUMMARY"
      - name: H-19 actual isolated MCP SDK stdio client/server and approval gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.h19_real_stdio_mcp --execute --out "$RUNNER_TEMP/h19-real-mcp-stdio.json"
          python3 -c 'import json,os; r=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"h19-real-mcp-stdio.json"))); print("Real local MCP:",r["status"],"full MCP:",r["full_mcp_permission_enforcement_verified"],"model:",r["real_model_evaluation"])' >> "$GITHUB_STEP_SUMMARY"
      - name: H-19 real MCP deny-by-toolset original versus bounded patched runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.h19_real_stdio_mcp --execute --compare-patched --out "$RUNNER_TEMP/h19-real-mcp-permissions.json"
          python3 -c 'import json,os; r=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"h19-real-mcp-permissions.json"))); print("MCP scoped policy:",r["status"],"external MCP:",r["external_mcp_effects_verified"],"H-01:",r["resident_agent_allowed"])' >> "$GITHUB_STEP_SUMMARY"
      - name: H-19 full CLI agent cycle with scripted loopback fake LLM and genuine MCP
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.h19_agent_fake_model_e2e --execute --out "$RUNNER_TEMP/h19-agent-fake-llm.json"
          python3 -c 'import json,os; r=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"h19-agent-fake-llm.json"))); print("Hermes full CLI loop:",r["status"],"cloud billed:",r["provider_billing"],"resident allowed:",r["resident_agent_allowed"])' >> "$GITHUB_STEP_SUMMARY"
      - name: H-19 real Hermes CLI adversarial MCP source profiles and benign control
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.h19_agent_injection_matrix --execute --out "$RUNNER_TEMP/h19-agent-injection-matrix.json"
          python3 -m scripts.h19_agent_injection_matrix --verify "$RUNNER_TEMP/h19-agent-injection-matrix.json"
          python3 -c 'import json,os; r=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"h19-agent-injection-matrix.json"))); print("Full CLI MCP profile matrix:",r["status"],"cases:",r["case_count"],"real model:",r["real_model"])' >> "$GITHUB_STEP_SUMMARY"
      - name: H-19 real loopback Streamable HTTP MCP server tool permission check
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.h19_real_http_mcp --execute --out "$RUNNER_TEMP/h19-real-http-mcp.json"
          python3 -m scripts.h19_real_http_mcp --verify "$RUNNER_TEMP/h19-real-http-mcp.json"
          python3 -c 'import json,os; r=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"h19-real-http-mcp.json"))); print("Real loopback HTTP MCP:",r["status"],"original spoof GAP:",r["untrusted_annotation_spoof_gap_observed"],"patched wire deny:",r["patched_spoof_blocked_on_wire"],"external MCP:",r["full_external_mcp_enforcement_verified"],"real model:",r["real_model_evaluation"])' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve sanitized, no-prompt native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hermes-h19-pinned-native
          path: |
            ${{ runner.temp }}/h19-native-report.json
            ${{ runner.temp }}/h19-native-readback.json
            ${{ runner.temp }}/h19-execve-seccomp.json
            ${{ runner.temp }}/h19-native-effects.json
            ${{ runner.temp }}/h19-real-mcp-stdio.json
            ${{ runner.temp }}/h19-real-mcp-permissions.json
            ${{ runner.temp }}/h19-agent-fake-llm.json
            ${{ runner.temp }}/h19-agent-injection-matrix.json
            ${{ runner.temp }}/h19-real-http-mcp.json
          if-no-files-found: warn
          retention-days: 7
