name: H779 Aero Glass validation and static sync (temporary)
on:
  push:
    branches: [feat/h779-apple27-aero-glass]
permissions:
  contents: write
jobs:
  visual-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout authorized UI branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: control_center/frontend/package-lock.json
      - name: Locked build and unit tests
        working-directory: control_center/frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm run test
          npm run build
      - name: Sync generated web assets to exact task branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feat/h779-apple27-aero-glass"
          git add -A control_center/web/
          if git diff --cached --quiet; then
            echo 'ASSETS=ALREADY_SYNCED' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if git diff --cached --name-only | grep -v '^control_center/web/'; then
            echo 'Refusing non-static staged changes' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(ui): sync H779 final readable light-theme assets'
          git push origin "HEAD:$GITHUB_REF"
          echo "ASSETS_SHA=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Setup isolated browser
        working-directory: control_center/frontend
        run: npx playwright install --with-deps chromium
      - name: Execute real H779 Playwright tests
        working-directory: control_center/frontend
        env:
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_HTML_OUTPUT_DIR: .artifacts/h779-finish-report
        run: npm run test:e2e -- apple27.spec.js --workers=1 --reporter=html
      - name: Store synthetic AFTER snapshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h779-final-light-contrast-visual-qa
          path: |
            control_center/frontend/.artifacts/h779-finish-report/
            control_center/frontend/.artifacts/playwright-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Record native Impeccable mechanical detector
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/pbakaus/impeccable.git "$RUNNER_TEMP/impeccable"
          git -C "$RUNNER_TEMP/impeccable" checkout --detach 83dc1bbe4c37636632e72a7752e9cc433e9a9901
          test "$(git -C "$RUNNER_TEMP/impeccable" rev-parse HEAD)" = 83dc1bbe4c37636632e72a7752e9cc433e9a9901
          skill="$RUNNER_TEMP/impeccable/.agents/skills/impeccable/scripts/impeccable"
          export IMPECCABLE_HOME="$RUNNER_TEMP/impeccable-engine-cache"
          cd control_center/frontend
          sh "$skill" engine-probe
          sh "$skill" context --target src/main.jsx
          set +e
          sh "$skill" detect --json src/main.jsx src/apple27.css src/OrbitOverview.jsx >"$RUNNER_TEMP/h779-impeccable-detect.json" 2>"$RUNNER_TEMP/h779-impeccable-detect.err"
          result=$?
          set -e
          echo "IMPECCABLE_NATIVE_DETECT_EXIT=$result" >> "$GITHUB_STEP_SUMMARY"
          head -c 12000 "$RUNNER_TEMP/h779-impeccable-detect.json" || :
          head -c 2000 "$RUNNER_TEMP/h779-impeccable-detect.err" || :
          cp "$RUNNER_TEMP/h779-impeccable-detect.json" control_center_impeccable_detect.json
      - name: Upload original detector findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h779-impeccable-original-detector
          path: control_center/frontend/control_center_impeccable_detect.json
          retention-days: 7
          if-no-files-found: ignore
