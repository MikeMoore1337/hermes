name: H454 native Linux offline websockets wheel and systemd runtime (NO HOST)

on:
  pull_request:
    paths:
      - scripts/h454_native_linux_wheel.py
      - scripts/h454_native_linux_active_unit.py
      - scripts/h454_native_linux_service.py
      - tests/test_h454_native_linux_wheel.py
      - tests/test_h454_native_linux_service.py
      - deploy/h454/native-linux/requirements.lock
      - docs/operations/h454-native-linux-wheel.md
      - .github/workflows/h454-native-linux-wheel.yml

permissions:
  contents: read

jobs:
  offline-wheel-and-native-unit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run offline schema, filesystem and systemd source tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest -v tests.test_h454_native_linux_wheel tests.test_h454_native_linux_service
          echo 'H454_NATIVE_LINUX_OFFLINE_WHEEL_UNIT_TESTS=PASS'
      - name: Fetch only official pure-Python websockets 17.2 wheel with exact PyPI SHA256
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 0700 "$RUNNER_TEMP/h454-native-wheel"
          python3 -m pip download \
            --disable-pip-version-check --no-deps \
            --only-binary=:all: --platform any --implementation py \
            --abi none --python-version 3.11 \
            --require-hashes \
            --dest "$RUNNER_TEMP/h454-native-wheel" \
            -r deploy/h454/native-linux/requirements.lock
          [[ "$(find "$RUNNER_TEMP/h454-native-wheel" -maxdepth 1 -type f | wc -l)" == 1 ]] || {
            echo 'H454_WHEEL=HOLD_FILE_COUNT';exit 2;
          }
          test -f "$RUNNER_TEMP/h454-native-wheel/websockets-17.2-py3-none-any.whl"
          echo 'H454_NATIVE_LINUX_OFFLINE_WHEEL_HASH=PASS'
      - name: Prove real verified PyPI wheel can be staged and imported with Python site disabled
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          from pathlib import Path
          import os
          import subprocess
          import sys
          from scripts.h454_native_linux_wheel import (
              WHEEL, WHEEL_SHA256, stage_wheel, rollback_wheel,
          )
          sha='a'*40
          raw=(Path(os.environ["RUNNER_TEMP"]) / "h454-native-wheel" / WHEEL).read_bytes()
          deps=Path(os.environ["RUNNER_TEMP"]) / "h454-native-wheel-extracted"
          deps.mkdir(mode=0o700)
          result=stage_wheel(
              raw, target="hermes-vps",release_sha=sha,
              root=deps,owner_uid=os.geteuid(),check_ancestors=False,
          )
          assert result["wheel_sha256"]==WHEEL_SHA256
          path=deps / ("main-"+sha)
          source="import sys;sys.path.insert(0,sys.argv[1]);import websockets;from websockets.sync.client import connect;assert websockets.__version__=='17.2';assert websockets.__file__.startswith(sys.argv[1]+'/')"
          proc=subprocess.run(
              [sys.executable,"-S","-B","-c",source,str(path)],
              stdin=subprocess.DEVNULL,capture_output=True,timeout=15,
              check=False,env={"PATH":"/usr/bin:/bin","PYTHONNOUSERSITE":"1"},
          )
          assert proc.returncode==0, "H454_OFFLINE_WHEEL_IMPORT_DENIED"
          undone=rollback_wheel(
              raw,target="hermes-vps",release_sha=sha,
              root=deps,owner_uid=os.geteuid(),check_ancestors=False,
          )
          assert undone["status"]=="PINNED_WHEEL_ROLLED_BACK"
          assert not path.exists()
          print("H454_NATIVE_LINUX_REAL_PYPI_WHEEL_STAGED=PASS")
          print("H454_NATIVE_LINUX_NO_GLOBAL_PIP_OR_HOST=PASS")
          PY
      - name: Upload verified original PyPI wheel only (NO HOST INSTALL)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: h454-native-linux-websockets-17.2-PYPI-SHA256-only
          path: ${{ runner.temp }}/h454-native-wheel/websockets-17.2-py3-none-any.whl
          retention-days: 7
          if-no-files-found: error
