name: H796 wide-screen and login visual QA (temporary)
on:
  push:
    branches: [fix/h796-wide-apple-login]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ui-build-and-capture:
    if: github.ref == 'refs/heads/fix/h796-wide-apple-login'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout task branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: true, fetch-depth: 1}
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: control_center/frontend/package-lock.json
      - name: Locked frontend install and checks
        working-directory: control_center/frontend
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          npm run check
          npm run test
          npm run build
      - name: Commit only generated static web output to task branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/fix/h796-wide-apple-login"
          git add -A control_center/web/
          if git diff --cached --quiet; then
            echo "STATIC_BUILD=SYNCED" >> "$GITHUB_STEP_SUMMARY"
          else
            if git diff --cached --name-only | grep -v '^control_center/web/'; then
              echo "Non-static file staged, refusing" >&2
              exit 1
            fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build(ui): sync H796 responsive desktop and auth assets'
            git push origin "HEAD:$GITHUB_REF"
            echo "STATIC_BUILD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Pinned Playwright Chromium
        working-directory: control_center/frontend
        run: npx playwright install --with-deps chromium
      - name: Run real browser UI and responsive login tests
        working-directory: control_center/frontend
        env:
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_HTML_OUTPUT_DIR: .artifacts/h796-report
        run: npm run test:e2e -- apple27-wide-login.spec.js aero-wordmark.spec.js accessibility.spec.js --reporter=html --workers=1
      - name: Save safe screenshots and metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h796-responsive-apple-login
          path: |
            control_center/frontend/.artifacts/h796-report/
            control_center/frontend/.artifacts/playwright-results/
          if-no-files-found: warn
          retention-days: 7
