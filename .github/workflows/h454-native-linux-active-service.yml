name: H454 Linux original-host WSS READ service (NO HOST DEPLOY)

on:
  pull_request:
    paths:
      - scripts/h454_native_linux_service.py
      - scripts/h454_native_linux_active_unit.py
      - scripts/h454_native_readonly_bundle.py
      - device_fabric/native_brc_status.py
      - device_fabric/native_brc_enrollment.py
      - tests/test_h454_native_linux_service.py
      - tests/test_h454_native_readonly_bundle.py
      - docs/operations/h454-native-linux-active-service.md
      - .github/workflows/h454-native-linux-active-service.yml

permissions:
  contents: read

jobs:
  original-linux-native-worker:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact synthetic source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Actual Linux systemd syntax and kernel evidence contracts
        shell: bash
        run: |
          set -euo pipefail
          command -v systemd-analyze
          python3 -B -m unittest -v tests.test_h454_native_linux_service
          echo 'H454_REAL_LINUX_SERVICE_SOURCE_AND_SYSTEMD=PASS'
      - name: Read-only kernel handles, private config, authoritative revocation and full source bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest -v \
            tests.test_h454_native_linux_runtime \
            tests.test_h454_native_linux_unit_candidate \
            tests.test_h454_native_readonly_bundle \
            tests.test_h454_native_brc_status
          echo 'H454_REAL_LINUX_READ_RUNTIME_AND_13_FILE_BUNDLE=PASS'
      - name: Prove no owner-host deployment or agent pairing
        shell: bash
        run: |
          set -euo pipefail
          test ! -e /var/lib/hermes-commander-native/device.json
          test ! -e /etc/systemd/system/hermes-commander-native.service
          echo 'H454_ORIGINAL_VPS_SERVICE=NOT_INSTALLED'
          echo 'H454_ORIGINAL_VPS_WSS=NOT_CONNECTED'
          echo 'H454_NATIVE_DEVICE_PAIRING=NOT_RUN'
