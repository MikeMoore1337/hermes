name: H15 temporary verified UI bundle and screenshot generation
on:
  push:
    branches:
      - feat/255-codex-alerts-history-ui
    paths:
      - control_center/frontend/**
      - .github/workflows/h15-temporary-build.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: control_center/frontend/package-lock.json
      - name: Build production files from reviewed source
        working-directory: control_center/frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Publish the reproducible generated UI and review evidence to this feature branch
        run: |
          git add -A control_center/web docs/ux/evidence/h15-codex-usage
          if ! git diff --cached --quiet; then
            git -c user.name='hermes-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(h15): commit verified UI bundle and review screenshots'
            git fetch origin feat/255-codex-alerts-history-ui
            git rebase origin/feat/255-codex-alerts-history-ui
            git push origin HEAD:feat/255-codex-alerts-history-ui
          fi
