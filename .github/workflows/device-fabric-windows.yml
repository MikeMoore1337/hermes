name: Hermes Windows device persistence syntax

on:
  pull_request:
    paths:
      - 'deploy/h15-device-fabric-windows-autostart.ps1'
      - '.github/workflows/device-fabric-windows.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/h15-device-fabric-windows-autostart.ps1'
      - '.github/workflows/device-fabric-windows.yml'

permissions:
  contents: read

jobs:
  windows-powershell-parse:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Parse PowerShell without executing privileged installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errors = $null
          $path = 'deploy/h15-device-fabric-windows-autostart.ps1'
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $path).Path, [ref]$tokens, [ref]$errors
          )
          if ($errors.Count -ne 0) {
            foreach ($issue in $errors) {
              Write-Error ("PowerShell parse error at line " + $issue.Extent.StartLineNumber)
            }
            exit 1
          }
          Write-Output 'WINDOWS_POWERSHELL_PARSE=PASS'

      - name: Check native Python version assertion on Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Get-Content 'deploy/h15-device-fabric-windows-autostart.ps1' -Raw
          if (-not $source.Contains('assert websockets.__version__ == str(16.0)')) {
            throw 'PINNED_VERSION_CHECK_MISSING'
          }
          & python -c 'import sys; sys.exit(0 if str(16.0) == sys.argv[1] else 1)' '16.0'
          if ($LASTEXITCODE -ne 0) { throw 'PYTHON_NATIVE_STRING_CHECK_FAILED' }
          & python -c 'import sys; sys.exit(0 if str(16.0) == sys.argv[1] else 1)' '15.0'
          if ($LASTEXITCODE -eq 0) { throw 'PYTHON_NATIVE_NEGATIVE_CHECK_FAILED' }
          Write-Output 'WINDOWS_NATIVE_ARGUMENTS=PASS'
          exit 0

      - name: Install pinned CPython for isolated runtime smoke
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.14'
          cache: ''

      - name: Smoke copied Python 3.14 without source site-packages
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Split-Path -Parent (Get-Command python.exe).Source
          $target = Join-Path $env:RUNNER_TEMP 'hermes-cpython-private-copy'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          foreach ($name in @('python.exe', 'python314.dll', 'python3.dll',
                              'vcruntime140.dll', 'vcruntime140_1.dll',
                              'python314.zip')) {
              $src = Join-Path $source $name
              if (Test-Path -LiteralPath $src) {
                  Copy-Item -LiteralPath $src -Destination $target
              }
          }
          foreach ($folder in @('Lib', 'DLLs')) {
              $from = Join-Path $source $folder
              $to = Join-Path $target $folder
              New-Item -ItemType Directory -Path $to -Force | Out-Null
              $exclude = @()
              if ($folder -eq 'Lib') {
                  $exclude = @('/XD', (Join-Path $from 'site-packages'))
              }
              & robocopy.exe $from $to /E /XJ /R:0 /W:0 /NFL /NDL /NJH /NJS /NP @exclude | Out-Null
              if ($LASTEXITCODE -ge 8) { throw 'CPYTHON_COPY_FAILED' }
          }
          $python = Join-Path $target 'python.exe'
          & $python -I -c 'import ssl, socket, venv, ensurepip, sys; assert sys.version_info[:2] == (3,14)'
          if ($LASTEXITCODE -ne 0) { throw 'COPIED_PYTHON_FAILED' }
          $venv = Join-Path $env:RUNNER_TEMP 'hermes-cpython-private-venv'
          & $python -I -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw 'COPIED_VENV_FAILED' }
          & (Join-Path $venv 'Scripts\python.exe') -c 'import ssl, socket, sys; assert sys.base_prefix != sys.prefix'
          if ($LASTEXITCODE -ne 0) { throw 'COPIED_VENV_RUNTIME_FAILED' }
          $configuration = Get-Content (Join-Path $venv 'pyvenv.cfg') -Raw
          if (-not $configuration.Contains($target)) { throw 'VENV_PROFILE_PATH_LEAK' }
          Write-Output 'WINDOWS_COPIED_CPYTHON=PASS'
          exit 0

      - name: Regression recover nested files with empty inherited ACLs
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'hermes-acl-recovery'
          $child = Join-Path $dir 'nested'
          $file = Join-Path $child 'windows-pc.json'
          New-Item -Path $child -ItemType Directory -Force | Out-Null
          Set-Content -LiteralPath $file -Value 'public-regression-fixture'
          # Reproduce observed broken state: child has no inheritable grants.
          & icacls.exe $file /inheritance:r | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'FIXTURE_ACL_SETUP_FAILED' }
          $scriptPath = (Resolve-Path 'deploy/h15-device-fabric-windows-autostart.ps1').Path
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
              $scriptPath, [ref]$tokens, [ref]$errors
          )
          $function = $ast.Find({
              param($node)
              $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
              $node.Name -eq 'Protect-PrivateState'
          }, $true)
          if (-not $function) { throw 'ACL_PROTECT_FUNCTION_MISSING' }
          . ([scriptblock]::Create($function.Extent.Text))
          Protect-PrivateState $dir
          if ((Get-Content -LiteralPath $file -Raw -ErrorAction Stop).Trim() -ne 'public-regression-fixture') {
              throw 'NESTED_FILE_NOT_READABLE_AFTER_ACL_REPAIR'
          }
          $acl = Get-Acl -LiteralPath $file
          $aclDetails = @($acl.Access | ForEach-Object { $_.IdentityReference.Translate(
              [Security.Principal.SecurityIdentifier]).Value })
          foreach ($sid in @('S-1-5-18', 'S-1-5-32-544', 'S-1-5-19')) {
              if ($sid -notin $aclDetails) { throw 'EXPECTED_FILE_GRANT_MISSING' }
          }
          Write-Output 'WINDOWS_PRIVATE_ACL_REPAIR=PASS'

      - name: Check installed task command matches shipped Windows agent SSH allowlist
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = (Resolve-Path 'deploy/h15-device-fabric-windows-autostart.ps1').Path
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
              $path, [ref]$tokens, [ref]$errors
          )
          $fn = $ast.Find({
              param($node)
              $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
              $node.Name -eq 'Get-PresenceTaskArguments'
          }, $true)
          if (-not $fn) { throw 'SSH_TASK_ARGUMENT_FUNCTION_MISSING' }
          $state = Join-Path $env:ProgramData 'HermesDevicePresence'
          . ([scriptblock]::Create($fn.Extent.Text))
          $command = Get-PresenceTaskArguments 'ssh.exe'
          if (-not $command.EndsWith('--ssh-bin ssh.exe')) {
              throw 'SSH_TASK_BINARY_NOT_ALLOWED'
          }
          if (-not $command.Contains('--watch') -or
              -not $command.Contains('--config') -or
              -not $command.Contains('--known-hosts')) {
              throw 'SSH_TASK_REQUIRED_ARGUMENTS_MISSING'
          }
          Write-Output 'WINDOWS_SSH_ARGS_WHITELIST=PASS'
          exit 0
