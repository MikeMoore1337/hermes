name: H779 sync Vite static build (branch-only)
on:
  push:
    branches: [feat/h779-apple27-aero-glass]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-commit:
    if: github.ref == 'refs/heads/feat/h779-apple27-aero-glass'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout task branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Node 22 (locked)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: control_center/frontend/package-lock.json
      - name: Build tracked static app (no deployment)
        working-directory: control_center/frontend
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          npm run check
          npm run build
      - name: Commit only generated control_center/web to task branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feat/h779-apple27-aero-glass"
          git add -A control_center/web/
          if git diff --cached --quiet; then
            echo 'STATIC_BUILD=ALREADY_SYNCHRONIZED'
            exit 0
          fi
          git diff --cached --name-only | grep -q '^control_center/web/'
          if git diff --cached --name-only | grep -v '^control_center/web/'; then
            echo 'Unexpected non-static files staged' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(ui): sync Aero Glass 27 Vite static web assets'
          git push origin "HEAD:$GITHUB_REF"
          echo "STATIC_BUILD_COMMITTED=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
