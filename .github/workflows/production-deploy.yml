name: Hermes production deploy

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Exact current main SHA approved by the owner for this cumulative release'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: hermes-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Verify current main and both required SHA-scoped checks
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          APPROVED_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ || "$APPROVED_SHA" != "$TARGET_SHA" ]]; then
            echo "Manual dispatch refused: approved SHA does not match the selected revision" >&2
            exit 1
          fi
          current="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          if [[ "$current" != "$TARGET_SHA" ]]; then
            echo "superseded by $current"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Main may contain several unreleased changes, so both checks must
          # pass on the exact SHA even when its last commit is documentation.
          gate_ready=false
          for attempt in $(seq 1 6); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$TARGET_SHA&branch=main&event=push&per_page=100")"
            quality="$(jq -r '[.workflow_runs[] | select(.name=="Hermes repository checks")] | first | .conclusion // "pending"' <<< "$runs")"
            ui="$(jq -r '[.workflow_runs[] | select(.name=="Hermes Control Center UI")] | first | .conclusion // "pending"' <<< "$runs")"
            if [[ "$quality" == success && "$ui" == success ]]; then
              echo "Exact SHA CI green: quality=$quality, UI=$ui"
              gate_ready=true
              break
            fi
            if [[ "$quality" == failure || "$quality" == cancelled || "$quality" == timed_out ||
                  "$ui" == failure || "$ui" == cancelled || "$ui" == timed_out ]]; then
              echo "CI gate failed: quality=$quality UI=$ui" >&2
              exit 1
            fi
            [[ "$attempt" -eq 6 ]] || sleep 10
          done
          if [[ "$gate_ready" != true ]]; then
            echo "Manual dispatch refused: required SHA-scoped checks not green" >&2
            exit 1
          fi
          latest="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          if [[ "$latest" != "$TARGET_SHA" ]]; then
            echo "Superseded before deploy by $latest"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Check out the exact approved main SHA
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare exact-SHA source archive
        if: steps.gate.outputs.deploy == 'true'
        id: archive
        shell: bash
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          git archive --format=tar.gz --output="$RUNNER_TEMP/hermes-main.tar.gz" "$TARGET_SHA"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/hermes-main.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Deploy through restricted pinned SSH transport
        if: steps.gate.outputs.deploy == 'true'
        shell: bash
        env:
          TARGET_SHA: ${{ github.sha }}
          ARCHIVE_SHA256: ${{ steps.archive.outputs.sha256 }}
          HERMES_DEPLOY_KEY: ${{ secrets.HERMES_DEPLOY_KEY }}
          HERMES_DEPLOY_TARGET: ${{ secrets.HERMES_DEPLOY_TARGET }}
          HERMES_DEPLOY_PORT: ${{ secrets.HERMES_DEPLOY_PORT }}
          HERMES_DEPLOY_KNOWN_HOSTS: ${{ secrets.HERMES_DEPLOY_KNOWN_HOSTS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          [[ "$latest" == "$TARGET_SHA" ]] || { echo "Superseded before SSH" >&2; exit 1; }
          [[ -n "$HERMES_DEPLOY_KEY" && -n "$HERMES_DEPLOY_TARGET" &&
             -n "$HERMES_DEPLOY_PORT" && -n "$HERMES_DEPLOY_KNOWN_HOSTS" ]] ||
             { echo "Production SSH configuration missing" >&2; exit 1; }
          umask 077
          printf '%s\n' "$HERMES_DEPLOY_KEY" > "$RUNNER_TEMP/hermes-key"
          printf '%s\n' "$HERMES_DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/hermes-known-hosts"
          # The production full-unit sandbox can remain stdout-quiet for over
          # four minutes; the SSH transport must not drop before its verdict.
          # Encrypted server-alive pings keep it bounded without relaxing auth.
          ssh -T -i "$RUNNER_TEMP/hermes-key" -p "$HERMES_DEPLOY_PORT" \
            -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=6 \
            -o "UserKnownHostsFile=$RUNNER_TEMP/hermes-known-hosts" \
            "$HERMES_DEPLOY_TARGET" "deploy $TARGET_SHA $ARCHIVE_SHA256" \
            < "$RUNNER_TEMP/hermes-main.tar.gz"
          rm -f "$RUNNER_TEMP/hermes-key"
