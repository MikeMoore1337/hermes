name: Hermes production deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Hermes repository checks"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: hermes-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' || (
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Verify current main and both required SHA-scoped checks
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          if [[ "$current" != "$TARGET_SHA" ]]; then
            echo "superseded by $current"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ui_required="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET_SHA" \
            --jq '[.files[].filename] | any(startswith("control_center/") or startswith("tests/test_control_center") or startswith("scripts/h15_") or . == ".github/workflows/control-center-ui.yml")')"
          if [[ "$ui_required" != true && "$ui_required" != false ]]; then
            echo "cannot determine UI check requirement" >&2; exit 1
          fi
          for attempt in $(seq 1 30); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$TARGET_SHA&branch=main&event=push&per_page=100")"
            quality="$(jq -r '[.workflow_runs[] | select(.name=="Hermes repository checks")] | first | .conclusion // "pending"' <<< "$runs")"
            ui="$(jq -r '[.workflow_runs[] | select(.name=="Hermes Control Center UI")] | first | .conclusion // "missing"' <<< "$runs")"
            if [[ "$quality" == success && ( "$ui_required" == false || "$ui" == success ) ]]; then
              echo "Exact SHA CI green: quality=$quality, UI=$ui, UI required=$ui_required"
              break
            fi
            if [[ "$quality" == failure || "$quality" == cancelled || "$quality" == timed_out ||
                  "$ui" == failure || "$ui" == cancelled || "$ui" == timed_out ]]; then
              echo "CI gate failed: quality=$quality UI=$ui" >&2; exit 1
            fi
            if [[ "$attempt" -eq 30 ]]; then
              echo "CI gate timed out: quality=$quality UI=$ui" >&2; exit 1
            fi
            sleep 10
          done
          latest="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          if [[ "$latest" != "$TARGET_SHA" ]]; then
            echo "Superseded before deploy by $latest"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Check out the exact approved main SHA
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Prepare exact-SHA source archive
        if: steps.gate.outputs.deploy == 'true'
        id: archive
        shell: bash
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          git archive --format=tar.gz --output="$RUNNER_TEMP/hermes-main.tar.gz" "$TARGET_SHA"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/hermes-main.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Deploy through restricted pinned SSH transport
        if: steps.gate.outputs.deploy == 'true'
        shell: bash
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          ARCHIVE_SHA256: ${{ steps.archive.outputs.sha256 }}
          HERMES_DEPLOY_KEY: ${{ secrets.HERMES_DEPLOY_KEY }}
          HERMES_DEPLOY_TARGET: ${{ secrets.HERMES_DEPLOY_TARGET }}
          HERMES_DEPLOY_PORT: ${{ secrets.HERMES_DEPLOY_PORT }}
          HERMES_DEPLOY_KNOWN_HOSTS: ${{ secrets.HERMES_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ -n "$HERMES_DEPLOY_KEY" && -n "$HERMES_DEPLOY_TARGET" &&
             -n "$HERMES_DEPLOY_PORT" && -n "$HERMES_DEPLOY_KNOWN_HOSTS" ]] ||
             { echo "Production SSH configuration missing" >&2; exit 1; }
          umask 077
          printf '%s\n' "$HERMES_DEPLOY_KEY" > "$RUNNER_TEMP/hermes-key"
          printf '%s\n' "$HERMES_DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/hermes-known-hosts"
          ssh -T -i "$RUNNER_TEMP/hermes-key" -p "$HERMES_DEPLOY_PORT" \
            -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/hermes-known-hosts" \
            "$HERMES_DEPLOY_TARGET" "deploy $TARGET_SHA $ARCHIVE_SHA256" \
            < "$RUNNER_TEMP/hermes-main.tar.gz"
          rm -f "$RUNNER_TEMP/hermes-key"
