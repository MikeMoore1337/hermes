name: H-22 temporary npm lockfile diagnosis

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/h22_npm_lockfile_probe_temporary.py
      - .github/workflows/h22-npm-temporary.yml

permissions:
  contents: read

jobs:
  temporary-public-npm-offline:
    if: github.head_ref == 'experiment/h22-npm-lockfile-mismatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify pinned OSV and public npm lockfile (Docker network-none)
        run: python3 scripts/h22_npm_lockfile_probe_temporary.py
