permissions:
  contents: read

jobs:
  synthetic-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile parser
        run: python -m py_compile scripts/h454_windows_candidate_contract.py scripts/h454_windows_prepare_init_candidate.py
      - name: Synthetic contract tests
        run: python -B -m unittest discover -s tests -p "test_h454_windows_candidate_contract.py" -v
      - name: Synthetic candidate preparer tests
        run: python -B -m unittest discover -s tests -p "test_h454_windows_prepare_init_candidate.py" -v
      - name: Launcher preparation never modifies live source
        run: python -B -m unittest discover -s tests -p "test_h454_windows_launcher_patch.py" -v
      - name: Launcher preservation and PowerShell 5.1 lifecycle fixtures
        run: python -B -m unittest discover -s tests -p "test_h454_windows_launcher_preserve.py" -v
      - name: WSS launcher composition and Windows TLS health
        env:
          H454_WINDOWS_WSS_HEALTH: '1'
        run: python -B -m unittest discover -s tests -p "test_h454_windows_wss_launcher.py" -v
      - name: WSS tunnel supervisor validation
        run: python -B -m unittest discover -s tests -p "test_h454_windows_wss_tunnel.py" -v
      - name: Fingerprint canonical WSS supervisor and installers
        run: python -B -c "import hashlib; from pathlib import Path; from scripts.h454_windows_wss_tunnel import build; print('H454_SUPERVISOR_SHA256=' + hashlib.sha256(build()).hexdigest().upper()); print('H454_WSS_FILES_SHA256=' + hashlib.sha256(Path('scripts/h454_windows_wss_files.ps1').read_bytes()).hexdigest().upper()); print('H454_ORIGINAL_PROFILE_SHA256=' + hashlib.sha256(Path('scripts/h454_windows_original_profile.ps1').read_bytes()).hexdigest().upper()); print('H454_RECOVERY_DOCKER_SHA256=' + hashlib.sha256(Path('scripts/h454_windows_recovery_docker.ps1').read_bytes()).hexdigest().upper()); print('H454_RECOVERY_ROUTE_SHA256=' + hashlib.sha256(Path('scripts/h454_windows_recovery_route.ps1').read_bytes()).hexdigest().upper())"
      - name: WSS tunnel configuration validation
        run: python -B -m unittest discover -s tests -p "test_h454_windows_wss_config.py" -v
      - name: Fingerprint recovery broker operators
        run: python -B -c "import hashlib; from pathlib import Path; paths=['h454_windows_guard_operator.ps1','h454_windows_broker_route.ps1','h454_windows_broker_monitor.ps1','h454_windows_broker_credential.ps1','h454_windows_original_restore.ps1','h454_windows_candidate_prepare.ps1','h454_windows_secure_credential.ps1','h454_verify_staged.cjs']; [print('H454_SOURCE_SHA256='+p+':'+hashlib.sha256(Path('scripts',p).read_bytes()).hexdigest().upper()) for p in paths]"
      - name: Immutable edit layer safety contracts (no owner Docker or credentials)
        run: python -B -m unittest discover -s tests -p "test_h454_agent_edit_image.py" -v
      - name: Parse disposable image smoke
        run: node --check scripts/h454_agent_edit_image_smoke.mjs
      - name: Synthetic SSH identity format and rejection tests
        run: node --test tests/h454_windows_wss_identity.test.mjs
      - name: Real PowerShell 5.1 stdin and failure diagnostics (no host services)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -B -m unittest discover -s tests -p "test_h454_windows_native_preflight.py" -v
          if ($LASTEXITCODE -ne 0) { throw 'H454_NATIVE_PREFLIGHT_TESTS_FAILED' }
          python -B -m unittest discover -s tests -p "test_h454_windows_guard_operator.py" -v
          if ($LASTEXITCODE -ne 0) { throw 'H454_GUARD_OPERATOR_BOUNDARY_FAILED' }
      - name: PowerShell 5.1 recovery guard and synthetic WSS credentials
        if: runner.os == 'Windows' && matrix.python-version == '3.11'
        shell: pwsh
        run: |
          $env:H454_GUARD_FIXTURE = Join-Path $env:RUNNER_TEMP 'h454-guard-block.ps1'
          $env:H454_ANCHOR_FIXTURE = Join-Path $env:RUNNER_TEMP 'h454-guard-anchor.txt'
          python -B -c "import os; from pathlib import Path; from scripts.h454_windows_launcher_guard import GUARD, ANCHOR; Path(os.environ['H454_GUARD_FIXTURE']).write_text(GUARD, encoding='utf-8'); Path(os.environ['H454_ANCHOR_FIXTURE']).write_text(ANCHOR, encoding='utf-8')"
          if ($LASTEXITCODE -ne 0) { throw 'H454_GUARD_GENERATION_FAILED' }
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/h454_windows_wss_task_fixture.ps1 -Source (Resolve-Path scripts/h454_windows_wss_task.ps1).Path -GuardPath $env:H454_GUARD_FIXTURE -AnchorPath $env:H454_ANCHOR_FIXTURE
          if ($LASTEXITCODE -ne 0) { throw 'H454_WSS_TASK_DEFINITION_FAILED' }
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/h454_windows_wss_task_register_fixture.ps1 -Source (Resolve-Path scripts/h454_windows_wss_task.ps1).Path -RecoverySource (Resolve-Path scripts/h454_windows_offline_recovery.ps1).Path -FilesSource (Resolve-Path scripts/h454_windows_wss_files.ps1).Path -SupervisorSource (Resolve-Path scripts/h454_windows_wss_tunnel.ps1).Path
          if ($LASTEXITCODE -ne 0) { throw 'H454_WSS_TASK_REGISTRATION_FAILED' }
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/h454_windows_wss_guard_install_fixture.ps1 -Source (Resolve-Path scripts/h454_windows_wss_task.ps1).Path -RecoverySource (Resolve-Path scripts/h454_windows_offline_recovery.ps1).Path
          if ($LASTEXITCODE -ne 0) { throw 'H454_WSS_GUARD_INSTALL_FAILED' }
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/h454_windows_launcher_guard_e2e.ps1 -GuardPath $env:H454_GUARD_FIXTURE -FixtureParent $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'H454_GUARD_TEST_FAILED' }
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/h454_windows_secure_credential_e2e.ps1 -Source (Resolve-Path scripts/h454_windows_secure_credential.ps1).Path
          if ($LASTEXITCODE -ne 0) { throw 'H454_CREDENTIAL_TEST_FAILED' }
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/h454_windows_broker_credential_e2e.ps1 -SecureSource (Resolve-Path scripts/h454_windows_secure_credential.ps1).Path -BrokerSource (Resolve-Path scripts/h454_windows_broker_credential.ps1).Path
          if ($LASTEXITCODE -ne 0) { throw 'H454_BROKER_CREDENTIAL_TEST_FAILED' }
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/h454_windows_offline_recovery_e2e.ps1 -Source (Resolve-Path scripts/h454_windows_offline_recovery.ps1).Path -GuardPath $env:H454_GUARD_FIXTURE -FixtureParent $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'H454_RECOVERY_TEST_FAILED' }
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/h454_windows_network_guard_e2e.ps1 -Source (Resolve-Path scripts/h454_windows_network_guard.ps1).Path
          if ($LASTEXITCODE -ne 0) { throw 'H454_NETWORK_GUARD_TEST_FAILED' }
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/h454_windows_broker_route_fixture.ps1 -Source (Resolve-Path scripts/h454_windows_network_guard.ps1).Path
          if ($LASTEXITCODE -ne 0) { throw 'H454_BROKER_ROUTE_TEST_FAILED' }
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/h454_windows_broker_monitor_fixture.ps1 -TaskSource (Resolve-Path scripts/h454_windows_wss_task.ps1).Path -MonitorSource (Resolve-Path scripts/h454_windows_broker_monitor.ps1).Path
          if ($LASTEXITCODE -ne 0) { throw 'H454_BROKER_MONITOR_TEST_FAILED' }
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/h454_windows_original_restore_fixture.ps1 -Verifier (Resolve-Path scripts/h454_verify_staged.cjs).Path
          if ($LASTEXITCODE -ne 0) { throw 'H454_ORIGINAL_RESTORE_TEST_FAILED' }
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/h454_windows_candidate_prepare_fixture.ps1
          if ($LASTEXITCODE -ne 0) { throw 'H454_CANDIDATE_PREPARE_TEST_FAILED' }
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/h454_windows_cutover_engine_e2e.ps1 -Source (Resolve-Path scripts/h454_windows_cutover_engine.ps1).Path -FixtureParent $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'H454_CUTOVER_ENGINE_TEST_FAILED' }
      - name: Synthetic Windows DPAPI and SSH-agent identity recovery
        if: runner.os == 'Windows' && matrix.python-version == '3.11'
        shell: pwsh
        run: |
          $service = Get-Service ssh-agent
          if ($service.StartType -eq 'Disabled') { Set-Service ssh-agent -StartupType Manual }
          if ($service.Status -ne 'Running') { Start-Service ssh-agent }
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/h454_windows_wss_identity_fixture.ps1 -FixtureParent $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'H454_IDENTITY_TEST_FAILED' }
