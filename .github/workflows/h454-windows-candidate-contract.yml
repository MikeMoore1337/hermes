name: H454 Windows candidate preparation and contract

on:
  pull_request:
    paths:
      - scripts/h454_windows_candidate_contract.py
      - scripts/h454_windows_prepare_init_candidate.py
      - scripts/h454_windows_native_preflight.ps1
      - tests/test_h454_windows_native_preflight.py
      - scripts/h454_windows_launcher_patch.py
      - tests/test_h454_windows_launcher_patch.py
      - scripts/h454_windows_launcher_preserve.py
      - scripts/h454_windows_launcher_guard.py
      - scripts/h454_windows_wss_launcher.py
      - scripts/h454_wss_fixture_certificates.sh
      - scripts/h454_windows_launcher_guard_e2e.ps1
      - scripts/h454_windows_secure_credential.ps1
      - scripts/h454_windows_secure_credential_e2e.ps1
      - scripts/h454_windows_offline_recovery.ps1
      - scripts/h454_windows_offline_recovery_e2e.ps1
      - scripts/h454_windows_network_guard.ps1
      - scripts/h454_windows_network_guard_e2e.ps1
      - scripts/h454_windows_cutover_engine.ps1
      - scripts/h454_windows_cutover_engine_e2e.ps1
      - tests/test_h454_windows_launcher_guard.py
      - tests/test_h454_windows_wss_launcher.py
      - tests/test_h454_windows_launcher_preserve.py
      - tests/h454_windows_launcher_preserve_fixture.ps1
      - scripts/h454_agent_edit_image.py
      - scripts/h454_agent_edit_image_smoke.mjs
      - tests/test_h454_agent_edit_image.py
      - tests/test_h454_windows_candidate_contract.py
      - tests/test_h454_windows_prepare_init_candidate.py
      - docs/operations/h454-windows-candidate-contract.md
      - docs/operations/h454-windows-candidate-preparer.md
      - docs/operations/h454-windows-native-preflight.md
      - .github/workflows/h454-windows-candidate-contract.yml
  push:
    branches: [main]
    paths:
      - scripts/h454_windows_candidate_contract.py
      - scripts/h454_windows_prepare_init_candidate.py
      - scripts/h454_windows_native_preflight.ps1
      - tests/test_h454_windows_native_preflight.py
      - scripts/h454_windows_launcher_patch.py
      - tests/test_h454_windows_launcher_patch.py
      - scripts/h454_windows_launcher_preserve.py
      - scripts/h454_windows_launcher_guard.py
      - scripts/h454_windows_wss_launcher.py
      - scripts/h454_wss_fixture_certificates.sh
      - scripts/h454_windows_launcher_guard_e2e.ps1
      - scripts/h454_windows_secure_credential.ps1
      - scripts/h454_windows_secure_credential_e2e.ps1
      - scripts/h454_windows_offline_recovery.ps1
      - scripts/h454_windows_offline_recovery_e2e.ps1
      - scripts/h454_windows_network_guard.ps1
      - scripts/h454_windows_network_guard_e2e.ps1
      - scripts/h454_windows_cutover_engine.ps1
      - scripts/h454_windows_cutover_engine_e2e.ps1
      - tests/test_h454_windows_launcher_guard.py
      - tests/test_h454_windows_wss_launcher.py
      - tests/test_h454_windows_launcher_preserve.py
      - tests/h454_windows_launcher_preserve_fixture.ps1
      - scripts/h454_agent_edit_image.py
      - scripts/h454_agent_edit_image_smoke.mjs
      - tests/test_h454_agent_edit_image.py
      - tests/test_h454_windows_candidate_contract.py
      - tests/test_h454_windows_prepare_init_candidate.py
      - docs/operations/h454-windows-candidate-contract.md
      - docs/operations/h454-windows-candidate-preparer.md
      - docs/operations/h454-windows-native-preflight.md
      - .github/workflows/h454-windows-candidate-contract.yml

permissions:
  contents: read

jobs:
  synthetic-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile parser
        run: python -m py_compile scripts/h454_windows_candidate_contract.py scripts/h454_windows_prepare_init_candidate.py
      - name: Synthetic contract tests
        run: python -B -m unittest discover -s tests -p "test_h454_windows_candidate_contract.py" -v
      - name: Synthetic candidate preparer tests
        run: python -B -m unittest discover -s tests -p "test_h454_windows_prepare_init_candidate.py" -v
      - name: Launcher preparation never modifies live source
        run: python -B -m unittest discover -s tests -p "test_h454_windows_launcher_patch.py" -v
      - name: Launcher preservation and PowerShell 5.1 lifecycle fixtures
        run: python -B -m unittest discover -s tests -p "test_h454_windows_launcher_preserve.py" -v
      - name: WSS launcher composition and Windows TLS health
        env:
          H454_WINDOWS_WSS_HEALTH: '1'
        run: python -B -m unittest discover -s tests -p "test_h454_windows_wss_launcher.py" -v
      - name: Immutable edit layer safety contracts (no owner Docker or credentials)
        run: python -B -m unittest discover -s tests -p "test_h454_agent_edit_image.py" -v
      - name: Parse disposable image smoke
        run: node --check scripts/h454_agent_edit_image_smoke.mjs
      - name: Real PowerShell 5.1 stdin and failure diagnostics (no host services)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -B -m unittest discover -s tests -p "test_h454_windows_native_preflight.py" -v
          if ($LASTEXITCODE -ne 0) { throw 'H454_NATIVE_PREFLIGHT_TESTS_FAILED' }
      - name: PowerShell 5.1 recovery guard and synthetic WSS credentials
        if: runner.os == 'Windows' && matrix.python-version == '3.11'
        shell: pwsh
        run: |
          $env:H454_GUARD_FIXTURE = Join-Path $env:RUNNER_TEMP 'h454-guard-block.ps1'
          python -B -c "import os; from pathlib import Path; from scripts.h454_windows_launcher_guard import GUARD; Path(os.environ['H454_GUARD_FIXTURE']).write_text(GUARD, encoding='utf-8')"
          if ($LASTEXITCODE -ne 0) { throw 'H454_GUARD_GENERATION_FAILED' }
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/h454_windows_launcher_guard_e2e.ps1 -GuardPath $env:H454_GUARD_FIXTURE -FixtureParent $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'H454_GUARD_TEST_FAILED' }
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/h454_windows_secure_credential_e2e.ps1 -Source (Resolve-Path scripts/h454_windows_secure_credential.ps1).Path
          if ($LASTEXITCODE -ne 0) { throw 'H454_CREDENTIAL_TEST_FAILED' }
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/h454_windows_offline_recovery_e2e.ps1 -Source (Resolve-Path scripts/h454_windows_offline_recovery.ps1).Path -GuardPath $env:H454_GUARD_FIXTURE -FixtureParent $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'H454_RECOVERY_TEST_FAILED' }
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/h454_windows_network_guard_e2e.ps1 -Source (Resolve-Path scripts/h454_windows_network_guard.ps1).Path
          if ($LASTEXITCODE -ne 0) { throw 'H454_NETWORK_GUARD_TEST_FAILED' }
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/h454_windows_cutover_engine_e2e.ps1 -Source (Resolve-Path scripts/h454_windows_cutover_engine.ps1).Path -FixtureParent $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'H454_CUTOVER_ENGINE_TEST_FAILED' }
