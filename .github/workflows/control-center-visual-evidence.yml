name: Hermes UI Visual Evidence (manual, synthetic)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact selected commit without saved credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node 22 with pinned npm lockfile
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: control_center/frontend/package-lock.json

      - name: Install existing frontend dependencies without lifecycle scripts
        working-directory: control_center/frontend
        run: npm ci --ignore-scripts --no-fund --no-audit

      - name: Install isolated Chromium browser
        working-directory: control_center/frontend
        run: npx playwright install --with-deps chromium

      - name: Capture synthetic-only Playwright evidence and HTML report
        working-directory: control_center/frontend
        env:
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_HTML_OUTPUT_DIR: .artifacts/visual-report
        run: npm run test:e2e -- visual-evidence.spec.js --reporter=html --workers=1

      - name: Upload screenshots, manifest and Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hermes-h440-synthetic-ui-evidence
          path: |
            control_center/frontend/.artifacts/visual-report/
            control_center/frontend/.artifacts/playwright-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Record exact source and evidence boundaries
        if: always()
        shell: bash
        run: |
          {
            echo "### Hermes #440 manual UI evidence"
            echo ""
            echo "Source SHA: \`$(git rev-parse HEAD)\`"
            echo "Data: synthetic / local loopback, remote OAuth and owner APIs denied"
            echo "Playwright artifact: hermes-h440-synthetic-ui-evidence"
            echo "This does not verify live VPS, OAuth, devices or visual owner acceptance."
          } >> "$GITHUB_STEP_SUMMARY"
