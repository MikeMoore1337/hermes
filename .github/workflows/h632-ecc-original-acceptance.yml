name: H-632 original ECC offline acceptance

on:
  pull_request:
    paths:
      - .github/workflows/h632-ecc-original-acceptance.yml
      - scripts/h632_ecc_acceptance.py
      - tests/test_h632_ecc_acceptance.py
      - scripts/h632_full_verification.py
      - tests/test_h632_full_verification.py
      - scripts/h632_model_authored_tdd.py
      - scripts/h632_model_tdd_driver.py
      - tests/test_h632_model_authored_tdd.py
      - docs/operations/ecc-upstream-as-is.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h632-ecc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  original-ecc-lifecycle:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout Hermes source without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run independent synthetic plan/guard tests
        run: |
          python3 -m unittest discover -s tests -p 'test_h632_ecc_acceptance.py' -v
          python3 -m unittest discover -s tests -p 'test_h632_full_verification.py' -v
          python3 -m unittest discover -s tests -p 'test_h632_model_authored_tdd.py' -v

      - name: Verify disposable GitHub runner and acquire exact original ECC SHA
        shell: bash
        env:
          ECC_SHA: 25278e7d7b6cf6e6a4e7a6c8e10f14ff22f0eb5b
        run: |
          set -euo pipefail
          [[ '${{ runner.environment }}' == 'github-hosted' ]]
          [[ "$RUNNER_OS" == 'Linux' ]]
          [[ "$(id -u)" != 0 ]]
          echo "ECC_SOURCE=$RUNNER_TEMP/ecc-h632-upstream" >> "$GITHUB_ENV"
          git -c core.hooksPath=/dev/null clone --filter=blob:none --no-checkout \
            https://github.com/affaan-m/ECC.git "$RUNNER_TEMP/ecc-h632-upstream"
          git -C "$RUNNER_TEMP/ecc-h632-upstream" -c core.hooksPath=/dev/null checkout --detach "$ECC_SHA"
          [[ "$(git -C "$RUNNER_TEMP/ecc-h632-upstream" rev-parse HEAD)" == "$ECC_SHA" ]]
          python3 scripts/h632_ecc_acceptance.py \
            --ecc-root "$RUNNER_TEMP/ecc-h632-upstream" \
            --out "$RUNNER_TEMP/ecc632-preflight.json" --preflight

      - name: Install original package dependencies without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          cd "$ECC_SOURCE"
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund --loglevel=error
          test -d node_modules

      - name: Obtain isolated test images (not production)
        shell: bash
        run: |
          set -euo pipefail
          docker pull node:22.16.0-bookworm-slim@sha256:048ed02c5fd52e86fda6fbd2f6a76cf0d4492fd6c6fee9e2c463ed5108da0e34
          docker pull nousresearch/hermes-agent@sha256:a11574b7fe8e1631d7d88d556677dac693bc058abf558cdeb899155688c1bf05
          docker inspect --format '{{.Id}} {{.Architecture}}' node:22.16.0-bookworm-slim@sha256:048ed02c5fd52e86fda6fbd2f6a76cf0d4492fd6c6fee9e2c463ed5108da0e34
          docker inspect --format '{{.Id}} {{.Architecture}}' \
            nousresearch/hermes-agent@sha256:a11574b7fe8e1631d7d88d556677dac693bc058abf558cdeb899155688c1bf05

      - name: Run original lifecycle and validate evidence without claiming product acceptance
        shell: bash
        run: |
          set -uo pipefail
          set +e
          python3 scripts/h632_ecc_acceptance.py \
            --ecc-root "$ECC_SOURCE" \
            --out "$RUNNER_TEMP/ecc632-original-acceptance.json"
          harness_exit="$?"
          set -e
          python3 -m json.tool "$RUNNER_TEMP/ecc632-original-acceptance.json" > /dev/null
          H632_HARNESS_EXIT="$harness_exit" python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "ecc632-original-acceptance.json"
          report = json.loads(p.read_text(encoding="utf-8"))
          expected_checks = (
              "original_plan_safe", "unrelated_files_preserved", "installed_files_match_original_plan",
              "original_installer_installed_skills", "reinstall_idempotent_files",
              "original_doctor_repair_update_preview", "unsupported_profile_refused",
              "real_hermes_skill_discovery", "real_hermes_skill_view_invoked",
              "os_network_and_outside_write_denied", "no_active_hooks_or_mcp",
              "original_managed_files_removed", "upstream_uninstall_preserves_unrelated",
              "ecc_owned_files_fully_reverted_in_test_scope", "hermes_runtime_files_preserved",
              "existing_owner_agents_preserved",
          )
          assert not report.get("error"), report.get("error")
          for key in expected_checks:
              assert report.get("checks", {}).get(key) is True, f"mandatory safety check failed: {key}"
          calls = report.get("calls", [])
          expected_calls = {
              "original-dry-run": 0, "original-install": 0, "original-reinstall": 0,
              "original-doctor": 0, "original-repair-dry-run": 0, "original-update-dry-run": 0,
              "unsupported-profile": 1, "real-hermes-skills-list": 0,
              "os-file-network-deny": 0, "original-uninstall-dry-run": 0,
              "original-uninstall": 0, "owner-agents-collision": 0,
          }
          assert {c["name"]: c["exit"] for c in calls} == expected_calls, "Missing/unexpected original call"
          assert report["ecc_sha"] == "25278e7d7b6cf6e6a4e7a6c8e10f14ff22f0eb5b"
          assert report["provenance"]["license"] == "MIT"
          assert report["native_hermes_discovery"]["source_sha"] == "d923a5eb487a17c0a68801bba9ef0f56c81040a8"
          assert all(report["native_hermes_discovery"]["found"].values())
          assert all(report["native_hermes_discovery"]["viewed"].values())
          assert report["original_skill_execution"] == "BLOCKED_BY_OWNER_POLICY"
          assert report["installed_runtime_config"]["root_hook_paths"] == []
          assert not report["installed_runtime_config"]["mcp_root_file"]
          assert not report["installed_runtime_config"]["mcp_root_config"]
          assert all(
              x == ".hermes/SOUL.md" or
              re.fullmatch(r"\.hermes/backups/config/config\.yaml\.good\.[A-Za-z0-9_-]+", x)
              for x in report.get("native_runtime_new_files", [])
          ), "Unattributed Hermes native runtime changes"
          status = report["status"]
          if status == "PARTIAL_ORIGINAL_INSTALL_SECURITY_OR_ROLLBACK":
              assert os.environ["H632_HARNESS_EXIT"] == "1", "Unexpected partial exit"
              assert report["checks"]["exact_snapshot_rollback"] is False
              assert report["checks"]["only_known_original_ecc_cache_residual"] is True
              assert report["rollback_non_runtime_residual_files"] == [".claude/ecc/state.db"]
              cleanup = report["test_only_cache_cleanup"]
              assert cleanup["path"] == ".claude/ecc/state.db"
              assert cleanup["scope"] == "disposable-H632-HOME-only"
              assert len(cleanup["deleted_sha256"]) == 64
              acceptance = "NO_GO: ECC-only test cleanup passed, but native uninstall leaves state.db; no model skill execution"
          elif status == "PASS_INSTALL_DISCOVERY_ROLLBACK_SKILL_EXECUTION_BLOCKED":
              assert os.environ["H632_HARNESS_EXIT"] == "0"
              assert report["checks"]["exact_snapshot_rollback"] is True
              assert not report.get("rollback_non_runtime_residual_files")
              acceptance = "PARTIAL: native uninstall clean, model-backed skills not executed"
          else:
              raise AssertionError("Unexpected/unreviewed acceptance outcome: " + str(status))
          print("H632_RECEIPT_INTEGRITY=PASS")
          print("H632_PRODUCT_ACCEPTANCE=" + acceptance)
          print("H632_ORIGINAL_SKILL_EXECUTION=BLOCKED_BY_OWNER_POLICY")
          print("H632_PRODUCTION_CHANGED=NO")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("### H632 source-only receipt verification: PASS\n\n")
              f.write("**Product acceptance: " + acceptance + "**\n\n")
              f.write("Original installation/discovery succeeded; no ECC model-backed skill was executed.\n\n")
              f.write("Controlled post-uninstall deletion is restricted to a test-created state.db in a disposable HOME; native ECC uninstall alone is still incomplete.\n\n")
              f.write("GitHub CI success validates the evidence and safety boundaries only, NOT the #632 closure criteria.\n")
          PY

      - name: Retain sanitized read-only acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: h632-original-ecc-isolated-receipt
          path: ${{ runner.temp }}/ecc632-original-acceptance.json
          if-no-files-found: ignore
          retention-days: 7

  original-ecc-model-backed:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    needs: original-ecc-lifecycle
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      ECC_SHA: 25278e7d7b6cf6e6a4e7a6c8e10f14ff22f0eb5b
      MODEL_SHA: aaf42c8b7c3cab2bf3d69c355048d4a0ee9973d48f16c731c0520ee914699223
      MODEL_IMAGE: ghcr.io/ggml-org/llama.cpp@sha256:9002e60256635720c05c50455fdebf992a98dc25466dc932758ecd7936244c1c
      HERMES_IMAGE: nousresearch/hermes-agent@sha256:a11574b7fe8e1631d7d88d556677dac693bc058abf558cdeb899155688c1bf05
      NODE_IMAGE: node:22.16.0-bookworm-slim@sha256:048ed02c5fd52e86fda6fbd2f6a76cf0d4492fd6c6fee9e2c463ed5108da0e34
    steps:
      - name: Checkout scope-limited H-632 harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Acquire and verify exact original ECC, pinned local model and isolated images
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTIONS" == true && "$RUNNER_OS" == Linux && "$(id -u)" != 0 ]]
          work="$RUNNER_TEMP/h632-model-smoke"
          test ! -e "$work"
          mkdir -m 0700 "$work"
          git -c core.hooksPath=/dev/null clone --filter=blob:none --no-checkout \
            https://github.com/affaan-m/ECC.git "$work/ecc"
          git -C "$work/ecc" -c core.hooksPath=/dev/null checkout --detach "$ECC_SHA"
          test "$(git -C "$work/ecc" rev-parse HEAD)" = "$ECC_SHA"
          python3 scripts/h632_ecc_acceptance.py --ecc-root "$work/ecc" \
            --out "$work/preflight.json" --preflight
          (cd "$work/ecc" && npm ci --omit=dev --ignore-scripts --no-audit --no-fund --loglevel=error)
          docker pull "$NODE_IMAGE"
          docker pull "$HERMES_IMAGE"
          docker pull "$MODEL_IMAGE"
          docker image inspect --format '{{.Id}} {{.Architecture}} {{json .RepoDigests}}' "$MODEL_IMAGE"
          curl --fail --location --retry 2 --max-time 600 --silent --show-error \
            "https://huggingface.co/unsloth/Qwen3.5-2B-GGUF/resolve/f6d5376be1edb4d416d56da11e5397a961aca8ae/Qwen3.5-2B-Q4_K_M.gguf" \
            --output "$work/Qwen3.5-2B-Q4_K_M.gguf"
          printf '%s  %s\n' "$MODEL_SHA" "$work/Qwen3.5-2B-Q4_K_M.gguf" | sha256sum --check -
          test "$(stat -c %s "$work/Qwen3.5-2B-Q4_K_M.gguf")" -eq 1280835840

      - name: Install original ECC, invoke skill through real Hermes and isolated model
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/h632-model-smoke"
          home="$work/home"
          ecc="$work/ecc"
          mkdir -m 0777 "$home"
          chmod 0777 "$home"
          mkdir -m 0777 "$home/.hermes" "$home/fixture"
          chmod 0777 "$home/.hermes" "$home/fixture"
          cat > "$home/fixture/h632_fixture_test.py" <<'PY'
          import unittest
          class TestSynthetic(unittest.TestCase):
              def test_arithmetic(self):
                  self.assertEqual(17 + 25, 42)
              def test_reverse(self):
                  self.assertEqual("safe"[::-1][::-1], "safe")
          if __name__ == "__main__":
              result = unittest.TextTestRunner().run(
                  unittest.defaultTestLoader.loadTestsFromTestCase(TestSynthetic))
              if result.wasSuccessful() and result.testsRun == 2:
                  from pathlib import Path
                  Path("/test-home/fixture/h632-phase4-proof.txt").write_text(
                      "H632_TWO_REAL_TESTS_PASSED", encoding="utf-8")
                  print("H632_TWO_REAL_TESTS_PASSED")
              raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
          chmod 0644 "$home/fixture/h632_fixture_test.py"
          # Prepare actual disposable JS build/type/lint/test/security/diff project.
          # The model dispatches an existing fixture, NOT autonomous code authoring.
          mkdir -m 0777 "$home/fixture/h632-sixphase"
          cp scripts/h632_full_verification.py "$home/fixture/h632_full_verification.py"
          chmod 0644 "$home/fixture/h632_full_verification.py"
          python3 scripts/h632_full_verification.py --prepare             --root "$home/fixture/h632-sixphase" > "$work/sixphase-prepared.json"
          cat > "$home/fixture/h632_tdd_cycle.py" <<'PY'
          #!/usr/bin/env python3
          """Synthetic TDD RED/GREEN/refactor fixture, isolated from owner projects."""
          from __future__ import annotations
          import ast
          import hashlib
          from pathlib import Path
          import subprocess
          import sys
          import trace
          
          root = Path("/test-home/fixture")
          kata = root / "h632-tdd-disposable"
          assert root.is_dir() and not kata.exists(), "Fixture must be fresh"
          kata.mkdir(mode=0o700)
          source = kata / "calc.py"
          test = kata / "test_calc.py"
          source.write_text(
              "def add(a: int, b: int) -> int:\n"
              "    return a - b\n", encoding="utf-8")
          test.write_text(
              "import unittest\nfrom calc import add\n"
              "class TestAdd(unittest.TestCase):\n"
              "    def test_positive(self): self.assertEqual(add(20, 22), 42)\n"
              "    def test_negative(self): self.assertEqual(add(-2, 3), 1)\n",
              encoding="utf-8")
          
          def test_result():
              return subprocess.run([sys.executable, "-m", "unittest", "discover", "-s", str(kata),
                                     "-p", "test_calc.py", "-v"], cwd=kata, capture_output=True,
                                    text=True, timeout=20, check=False)
          
          red = test_result()
          assert red.returncode != 0 and "Ran 2 tests" in red.stderr and "FAIL" in red.stderr, red.stderr[-500:]
          assert "AssertionError" in red.stderr, "RED must be caused by functional bug"
          print("H632_TDD_RED_EXPECTED_LOGIC_FAILURE=PASS", flush=True)
          source.write_text(
              "def add(a: int, b: int) -> int:\n"
              "    return a + b\n", encoding="utf-8")
          green = test_result()
          assert green.returncode == 0 and "Ran 2 tests" in green.stderr and "OK" in green.stderr, green.stderr[-500:]
          print("H632_TDD_GREEN_TWO_REAL_TESTS=PASS", flush=True)
          source.write_text(
              "def add(a: int, b: int) -> int:\n"
              "    \"\"\"Add two integer operands.\"\"\"\n"
              "    return sum((a, b))\n", encoding="utf-8")
          refactor = test_result()
          assert refactor.returncode == 0 and "Ran 2 tests" in refactor.stderr and "OK" in refactor.stderr
          print("H632_TDD_REFACTOR_TESTS_STILL_GREEN=PASS", flush=True)
          sys.path.insert(0, str(kata))
          from calc import add
          tracker = trace.Trace(count=True, trace=False)
          assert tracker.runfunc(add, 20, 22) == 42
          assert tracker.runfunc(add, -2, 3) == 1
          records = tracker.results().counts
          executed = {line for (file_name, line), count in records.items()
                      if Path(file_name).resolve() == source.resolve() and count > 0}
          root_ast = ast.parse(source.read_text(encoding="utf-8"))
          returns = {n.lineno for n in ast.walk(root_ast) if isinstance(n, ast.Return)}
          assert len(returns) == 1 and returns <= executed, (returns, executed)
          print("H632_TDD_IMPLEMENTATION_RETURN_COVERAGE=100%", flush=True)
          print("H632_TDD_SOURCE_SHA256=" + hashlib.sha256(source.read_bytes()).hexdigest(), flush=True)
          (root / "h632-tdd-proof.txt").write_text(
              "H632_TDD_RED_GREEN_REFACTOR_COVERAGE_PASSED", encoding="utf-8")
          PY
          chmod 0644 "$home/fixture/h632_tdd_cycle.py"
          cp scripts/h632_model_authored_tdd.py "$home/fixture/h632_model_authored_tdd.py"
          cp scripts/h632_model_tdd_driver.py "$home/fixture/h632_model_tdd_driver.py"
          chmod 0644 "$home/fixture/h632_model_authored_tdd.py" "$home/fixture/h632_model_tdd_driver.py"
          docker run --rm --init --pull never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges:true --user "$(id -u):$(id -g)" \
            --memory 1024m --cpus 1 --pids-limit 64 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m \
            --mount "type=bind,src=$ecc,dst=/ecc,readonly" \
            --mount "type=bind,src=$home,dst=/test-home" \
            --env HOME=/test-home --env HERMES_HOME=/test-home/.hermes \
            --env HERMES_WRITE_SAFE_ROOT=/test-home/.hermes \
            --workdir /ecc --entrypoint /bin/bash "$NODE_IMAGE" \
            ./install.sh --target hermes --profile minimal --json > "$work/install-result.json"
          cmp "$ecc/skills/verification-loop/SKILL.md" \
            "$home/.hermes/skills/verification-loop/SKILL.md"
          cmp "$ecc/skills/tdd-workflow/SKILL.md" \
            "$home/.hermes/skills/tdd-workflow/SKILL.md"
          # Source-only H-632 test configuration: disable Hermes' progressive
          # tool-search bridge so skill_view and terminal are always direct.
          # No upstream ECC file or owner/production config is modified.
          test ! -e "$home/.hermes/config.yaml"
          cat > "$home/.hermes/config.yaml" <<'YAML'
          tools:
            tool_search:
              enabled: "off"
          YAML
          chmod 0644 "$home/.hermes/config.yaml"

          cat > "$home/run_model.py" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import time
          from urllib.request import urlopen

          home = Path("/test-home")
          skill = home / ".hermes/skills/verification-loop/SKILL.md"
          skill_sha = hashlib.sha256(skill.read_bytes()).hexdigest()
          assert skill_sha == "5b06be54d4852f60e6cf1b04c6e9a4748554334eb3e41af6c0959b544e6464ae"
          stamp = json.loads(Path("/opt/hermes/install-stamp.json").read_text())
          assert stamp["commit"] == "d923a5eb487a17c0a68801bba9ef0f56c81040a8"
          for forbidden in ("/private-second-brain", "/private-yfc", "/run/secrets", "/var/run/docker.sock"):
              assert not Path(forbidden).exists(), forbidden
          for _ in range(75):
              try:
                  with urlopen("http://127.0.0.1:8080/health", timeout=3) as r:
                      if r.status == 200:
                          break
              except Exception:
                  pass
              time.sleep(2)
          else:
              raise RuntimeError("Local offline LLM server did not become healthy")
          from tools.tool_search import load_config
          assert load_config().enabled == "off", "H-632 tool-search config not loaded"
          from run_agent import AIAgent
          
          def parse_tool_calls(messages):
              events = []
              for message in messages:
                  if not isinstance(message, dict) or message.get("role") != "assistant":
                      continue
                  for call in message.get("tool_calls") or []:
                      fn = call.get("function", {})
                      args = fn.get("arguments", {})
                      if isinstance(args, str):
                          try:
                              args = json.loads(args)
                          except ValueError:
                              args = {}
                      events.append((fn.get("name"), args))
              return events
          
          common = dict(base_url="http://127.0.0.1:8080/v1",
                        api_key="free-local-only", provider="custom", api_mode="chat_completions",
                        model="h632-local", quiet_mode=True, skip_context_files=True,
                        skip_memory=True, skip_background_review=True, save_trajectories=False)
          reader = AIAgent(**common, enabled_toolsets=["skills"], max_iterations=2,
                           max_tokens=96, run_budget_seconds=280)
          reader_tools = {t["function"]["name"] for t in reader.tools if t.get("type") == "function"}
          assert "skill_view" in reader_tools and "terminal" not in reader_tools
          assert not {"tool_search", "tool_describe", "tool_call"} & reader_tools, reader_tools
          read_result = reader.run_conversation(
              "Call the actual Hermes skill_view(name='verification-loop') tool to read the "
              "original upstream ECC instructions. Do not run tests or any terminal command.",
              system_message="/no_think\nRead the original skill via the real skill_view tool. "
                             "Only read; do not execute. Scope is synthetic H632 HOME only.")
          assert isinstance(read_result, dict)
          reader_messages = read_result.get("messages", [])
          reader_calls = parse_tool_calls(reader_messages)
          reader_outputs = [str(m.get("content", "")) for m in reader_messages
                            if isinstance(m, dict) and m.get("role") == "tool"]
          view_called = any(n == "skill_view" and a.get("name") == "verification-loop"
                            for n, a in reader_calls)
          original_view = next((out for out in reader_outputs if "Verification Loop Skill" in out
                                and "Phase 4" in out), "")
          assert view_called and original_view, "Real model did not read original verification-loop skill"
          assert all(n != "terminal" for n, _ in reader_calls), "Reader must never call terminal"
          try:
              original_text = json.loads(original_view).get("content", original_view)
          except (ValueError, AttributeError):
              original_text = original_view
          assert isinstance(original_text, str) and "Verification Loop Skill" in original_text
          # Preserve the unmodified upstream source for provenance and pass only
          # its six exact phase headings to a tiny offline executor; this avoids
          # mistaking upstream example shell commands for permitted terminal calls.
          phase_headings = [line for line in original_text.splitlines()
                            if line.startswith("### Phase ")]
          assert len(phase_headings) == 6 and all(
              line.startswith(f"### Phase {i}:") for i, line in enumerate(phase_headings, 1))
          original_excerpt = original_text[:500] + "\n" + "\n".join(phase_headings)
          # One model tool-call cycle: the pinned Hermes runtime then only
          # summarizes, preventing a second unreviewed terminal action.
          # The command allowlist below remains independently fail-closed.
          executor = AIAgent(**common, enabled_toolsets=["terminal"], max_iterations=1,
                             max_tokens=128, run_budget_seconds=300)
          # Native "terminal" toolset also advertises process_manage, which the
          # small offline model may select instead of terminal. This ephemeral
          # test agent restricts advertised tools to the genuine native terminal;
          # the underlying Hermes tool dispatch and original ECC stay unchanged.
          executor.tools = [t for t in executor.tools
                            if t.get("function", {}).get("name") == "terminal"]
          executor.valid_tool_names = {"terminal"}
          executor_tools = {t["function"]["name"] for t in executor.tools if t.get("type") == "function"}
          assert executor_tools == {"terminal"}, executor_tools
          assert not {"tool_search", "tool_describe", "tool_call"} & executor_tools, executor_tools
          result = executor.run_conversation(
              "Original ECC verification-loop headings retrieved by real Hermes "
              "skill_view (full source hash-verified):\n" + original_excerpt +
