name: H779 final Lucide build and QA (temporary)
on:
  push:
    branches: [feat/h779-apple27-aero-glass]
permissions:
  contents: write
jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: control_center/frontend/package-lock.json
      - name: Build source-locked frontend
        working-directory: control_center/frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-fund --no-audit
          npm run check
          npm run test
          npm run build
      - name: Commit static output only on exact feature ref
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feat/h779-apple27-aero-glass"
          git add -A control_center/web/
          if git diff --cached --quiet; then
            echo "STATIC_WEB=ALREADY_SYNCED" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if git diff --cached --name-only | grep -v '^control_center/web/'; then
            echo 'Refusing non-static files' >&2; exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(ui): sync final H779 Lucide disclosure assets'
          git push origin "HEAD:$GITHUB_REF"
          echo "BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Install Chromium for isolated browser QA
        working-directory: control_center/frontend
        run: npx playwright install --with-deps chromium
      - name: Verify Aero Glass views and screenshot evidence
        working-directory: control_center/frontend
        env:
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_HTML_OUTPUT_DIR: .artifacts/h779-lucide-report
        run: npm run test:e2e -- apple27.spec.js --reporter=html --workers=1
      - name: Save final synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h779-final-lucide-after-visual
          path: |
            control_center/frontend/.artifacts/h779-lucide-report/
            control_center/frontend/.artifacts/playwright-results/
          if-no-files-found: warn
          retention-days: 7
      - name: Run original pinned Impeccable detector
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/pbakaus/impeccable.git "$RUNNER_TEMP/impeccable"
          git -C "$RUNNER_TEMP/impeccable" checkout --detach 83dc1bbe4c37636632e72a7752e9cc433e9a9901
          test "$(git -C "$RUNNER_TEMP/impeccable" rev-parse HEAD)" = 83dc1bbe4c37636632e72a7752e9cc433e9a9901
          export IMPECCABLE_HOME="$RUNNER_TEMP/impeccable-cache"
          script="$RUNNER_TEMP/impeccable/.agents/skills/impeccable/scripts/impeccable"
          cd control_center/frontend
          sh "$script" engine-probe
          sh "$script" context --target src/main.jsx
          sh "$script" detect --json src/main.jsx src/apple27.css src/OrbitOverview.jsx | tee "$RUNNER_TEMP/h779-detector.json"
          echo "ORIGINAL_SKILL=impeccable" >> "$GITHUB_STEP_SUMMARY"
          echo "PINNED_SKILL_SHA=83dc1bbe4c37636632e72a7752e9cc433e9a9901" >> "$GITHUB_STEP_SUMMARY"
          echo "RUNNER_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "NATIVE_DETECT=EXIT_0" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p .artifacts/h779-original
          cp "$RUNNER_TEMP/h779-detector.json" .artifacts/h779-original/findings.json
      - name: Upload Impeccable native receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h779-final-lucide-impeccable-detector
          path: control_center/frontend/.artifacts/h779-original/
          if-no-files-found: ignore
          retention-days: 7
