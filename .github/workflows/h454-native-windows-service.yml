name: H454 native Windows SCM disabled-service candidate (NO DEPLOY)

on:
  pull_request:
    paths:
      - deploy/h454/native-windows-service/**
      - tests/h454_native_windows_acl/**
      - docs/operations/h454-native-windows-service.md
      - tests/test_h454_native_windows_service.py
      - tests/h454_native_windows_scm_worker_auth/**
      - scripts/h454_native_win32_worker.py
      - scripts/h15_native_windows_outbound.py
      - device_fabric/windows_native_reenrollment.py
      - .github/workflows/h454-native-windows-service.yml

permissions:
  contents: read

jobs:
  windows-scm-candidate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - name: Checkout exact PR test tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check source-only no-effects policy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B -m unittest -v tests.test_h454_native_windows_service
          if ($LASTEXITCODE -ne 0) { throw 'H454_WIN32_SERVICE_SOURCE_DENIED' }
      - name: Set up free .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Prove private-state NTFS ACL rights under actual Windows APIs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project 'tests/h454_native_windows_acl/NativeAclFixture.csproj' --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'H454_WIN32_PRIVATE_ACL_DENIED' }
          Write-Output 'H454_WIN32_PRIVATE_ACL_FIXTURE=PASS'
      - name: Verify signed release receipt refuses wrong binaries (disposable CI)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project 'tests/h454_native_windows_scm_worker_auth/HermesNativeWorkerReceiptTests.csproj' --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'H454_WIN32_RECEIPT_POLICY_DENIED' }
          Write-Output 'H454_WIN32_SIGNED_RELEASE_RECEIPT=PASS'
          Write-Output 'H454_WINDOWS_NATIVE_AGENT_STARTED=NO'
      - name: Build isolated Windows service and verify exact SHA / fail closed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = 'deploy/h454/native-windows-service/HermesCommanderNativeService.csproj'
          $out = Join-Path $env:RUNNER_TEMP 'h454-windows-scm'
          dotnet publish $project --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false "-p:SourceRevisionId=$env:GITHUB_SHA" -o $out
          if ($LASTEXITCODE -ne 0) { throw 'H454_WIN32_SCM_BUILD_DENIED' }
          $exe = Join-Path $out 'HermesCommanderNativeService.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'H454_WIN32_SCM_EXE_MISSING' }
          $good = Start-Process -FilePath $exe -ArgumentList @('--self-test', $env:GITHUB_SHA) -PassThru -Wait
          $wrong = Start-Process -FilePath $exe -ArgumentList @('--self-test', ('f' * 40)) -PassThru -Wait
          $direct = Start-Process -FilePath $exe -ArgumentList @('--service') -PassThru -Wait
          if ($good.ExitCode -ne 0 -or $wrong.ExitCode -eq 0 -or $direct.ExitCode -eq 0) {
            throw 'H454_WIN32_SCM_SELF_TEST_DENIED'
          }
          if ((Get-AuthenticodeSignature -LiteralPath $exe).Status.ToString() -ne 'NotSigned') {
            throw 'H454_WIN32_SCM_UNSIGNED_EXPECTED'
          }
          Write-Output 'H454_WIN32_SCM_OFFLINE_SELFTEST=PASS'
      - name: Verify actual SCM disabled registration and rollback on disposable runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'HermesCommanderNative'
          $exe = Join-Path $env:RUNNER_TEMP 'h454-windows-scm/HermesCommanderNativeService.exe'
          if (Get-Service -Name $name -ErrorAction SilentlyContinue) {
            throw 'H454_WIN32_SCM_NAME_COLLISION'
          }
          $created = $false
          try {
            $binary = '"' + $exe + '" --service'
            & sc.exe create $name binPath= $binary start= disabled type= own obj= "NT AUTHORITY\LocalService"
            if ($LASTEXITCODE -ne 0) { throw 'H454_WIN32_SCM_CREATE_DENIED' }
            $created = $true
            $service = Get-CimInstance -ClassName Win32_Service -Filter "Name='$name'"
            if ($null -eq $service -or $service.StartMode -ne 'Disabled' -or
                $service.State -ne 'Stopped' -or
                $service.StartName -notmatch 'LocalService') {
              throw 'H454_WIN32_SCM_DISABLED_STATE_DENIED'
            }
            Write-Output 'H454_WIN32_SCM_DISABLED=PASS'
            # This SCM start is only on a disposable GitHub Windows runner.
            # The LocalService fixture must be rejected by the NEW service-SID
            # gate before any private state/root inspection or network call.
            & sc.exe config $name start= demand | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'H454_SCM_CI_DEMAND_DENIED' }
            try {
              $PSNativeCommandUseErrorActionPreference = $false
              & sc.exe start $name *> $null
              $actual = $null
              for ($attempt = 0; $attempt -lt 12; $attempt++) {
                Start-Sleep -Milliseconds 500
                $actual = Get-CimInstance -ClassName Win32_Service -Filter "Name='$name'"
                if ($actual.State -eq 'Stopped' -and $actual.ExitCode -eq 1066 -and
                    $actual.ServiceSpecificExitCode -eq 455) { break }
              }
              if ($null -eq $actual -or $actual.State -ne 'Stopped' -or
                  $actual.ExitCode -ne 1066 -or
                  $actual.ServiceSpecificExitCode -ne 455) {
                throw 'H454_SCM_CI_FAIL_CLOSED_RUNTIME_NOT_PROVEN'
              }
              Write-Output 'H454_WIN32_SCM_WRONG_SID=DENIED'
            } finally {
              & sc.exe config $name start= disabled | Out-Null
              if ($LASTEXITCODE -ne 0) { throw 'H454_SCM_CI_RESET_DENIED' }
            }
            Write-Output 'H454_OWNER_WINDOWS_HOST=NOT_RUN'
            Write-Output 'H454_OWNER_WINDOWS_SERVICE_ACTIVATION=NOT_RUN'
          } finally {
            if ($created) {
              & sc.exe delete $name | Out-Null
              if ($LASTEXITCODE -ne 0) { throw 'H454_WIN32_SCM_CLEANUP_DENIED' }
            }
          }
