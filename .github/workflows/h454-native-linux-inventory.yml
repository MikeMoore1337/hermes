name: H454 Linux original-host read-only inventory (manual SSH)

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact current main SHA
        required: true
        type: string
      target:
        description: Approved original Linux host
        required: true
        type: choice
        options:
          - hermes-vps
          - yfc-vps

permissions:
  contents: read
  actions: read

jobs:
  inventory:
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: ${{ inputs.target == 'hermes-vps' && 'h454-hermes-native-inventory' || 'h454-yfc-native-inventory' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fail closed unless exact current main and repository/UI checks pass
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main &&
             "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ &&
             "$SOURCE_SHA" == "$GITHUB_SHA" ]] || exit 2
          latest="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          [[ "$latest" == "$GITHUB_SHA" ]] || exit 2
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&branch=main&event=push&per_page=100")"
          quality="$(jq -r '[.workflow_runs[] | select(.name=="Hermes repository checks")] | first | .conclusion // "pending"' <<< "$runs")"
          ui="$(jq -r '[.workflow_runs[] | select(.name=="Hermes Control Center UI")] | first | .conclusion // "pending"' <<< "$runs")"
          [[ "$quality" == success && "$ui" == success ]] || exit 2
      - name: Checkout exact source without stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read through dedicated restricted per-host SSH key only
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          HOST: ${{ secrets.H454_NATIVE_INVENTORY_HOST }}
          KEY: ${{ secrets.H454_NATIVE_INVENTORY_KEY }}
          KNOWN_HOSTS: ${{ secrets.H454_NATIVE_INVENTORY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$TARGET" == hermes-vps || "$TARGET" == yfc-vps ]] || exit 2
          host="$HOST"; key="$KEY"; known="$KNOWN_HOSTS"
          [[ "$host" =~ ^[A-Za-z0-9.-]{3,253}$ &&
             -n "$key" && -n "$known" ]] || {
            echo 'H454_INVENTORY=HOLD_UNPROVISIONED' >&2; exit 2
          }
          private="$(mktemp -d)"
          trap 'rm -rf "$private"' EXIT
          printf '%s\n' "$key" > "$private/id"
          printf '%s\n' "$known" > "$private/known_hosts"
          chmod 0600 "$private/id" "$private/known_hosts"
          # Enforce a total remote read deadline and hard response-size cap
          # before JSON parsing: a compromised host cannot stream forever.
          timeout 25s ssh -F /dev/null -i "$private/id" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$private/known_hosts" \
            -o ConnectTimeout=8 -o ConnectionAttempts=1 \
            -o RequestTTY=no -o ForwardAgent=no \
            -o ForwardX11=no -o ClearAllForwardings=yes \
            "h454-native-inventory@$host" inventory 2>/dev/null \
            | head -c 4097 > "$private/raw.json" || {
              echo 'H454_INVENTORY=HOLD_REMOTE' >&2; exit 2
            }
          python3 -B -m scripts.h454_native_linux_inventory \
            --target "$TARGET" --verify-stdin \
            < "$private/raw.json" > "$RUNNER_TEMP/h454-linux-inventory.json"
          echo 'H454_INVENTORY=READ_ONLY'
          echo 'H454_OWNER_HOST_MODIFIED=NO'
      - name: Upload fixed-schema sanitized inventory only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: h454-native-inventory-${{ inputs.target }}
          path: ${{ runner.temp }}/h454-linux-inventory.json
          if-no-files-found: error
          retention-days: 2
