name: H-15 native Windows read handle CI (synthetic only)

on:
  pull_request:
    paths:
      - scripts/h15_native_windows_read.py
      - scripts/h15_native_windows_mcp_stdio.py
      - scripts/h15_native_windows_outbound.py
      - scripts/h15_native_windows_ssh_identity.ps1
      - tests/h15_native_windows_ssh_verify_smoke.ps1
      - tests/test_h15_native_windows_outbound.py
      - tests/test_h15_native_windows_relay_contract.py
      - scripts/h15_brc_native_read_gate_patch.py
      - deploy/h15/hermes-native-read-gate.template.ts
      - tests/test_h15_brc_native_read_gate_patch.py
      - tests/test_h15_native_windows_mcp_stdio.py
      - control_center/native_windows_policy.py
      - tests/test_h15_native_windows_read.py
      - tests/test_h15_native_windows_read_on_win.py
      - tests/test_h15_native_windows_list.py
      - .github/workflows/h15-native-windows-read.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  win32-handle-synthetic:
    # Only repository-owned PRs: never run native Win32 fixtures from forks.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - name: Checkout exact submitted tree without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check native SSH key operator parser and owner-approval fail-closed
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $target = Join-Path $env:GITHUB_WORKSPACE 'scripts/h15_native_windows_ssh_identity.ps1'
          $tokens = $null
          $errorsFound = $null
          [System.Management.Automation.Language.Parser]::ParseFile($target, [ref]$tokens, [ref]$errorsFound) | Out-Null
          if (@($errorsFound).Count -ne 0) { throw 'IDENTITY_SCRIPT_PS_PARSER_FAILED' }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $target -Mode Preflight
          if ($LASTEXITCODE -ne 0) { throw 'IDENTITY_SCRIPT_READONLY_PREFLIGHT_FAILED' }
          # Deliberately no OwnerApproved; must fail before key creation.
          $output = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $target -Mode Generate
          if ($LASTEXITCODE -ne 2 -or
              ($output -join " ") -notmatch 'EXPLICIT_OWNER_APPROVAL_REQUIRED') {
              throw 'IDENTITY_SCRIPT_UNAUTHORIZED_GENERATE_NOT_DENIED'
          }
          Write-Output 'H454_NATIVE_WINDOWS_SSH_OPERATOR_DENY=PASS'
          # A deliberately rejected subprocess exits 2. Reset the parent
          # runner's LASTEXITCODE only after asserting that exact denial.
          $global:LASTEXITCODE = 0
      - name: Verify encrypted key and restrictive ACL on disposable Windows fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/h15_native_windows_ssh_verify_smoke.ps1
          if ($LASTEXITCODE -ne 0) { throw 'H454_NATIVE_SSH_VERIFY_SYNTHETIC_FAILED' }
      - name: Run actual Windows CreateFile / handle E2E on synthetic runner files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:RUNNER_OS -ne "Windows") { throw "WINDOWS_RUNNER_REQUIRED" }
          python --version
          python -B -m unittest -v tests.test_h15_native_windows_read_on_win
          if ($LASTEXITCODE -ne 0) { throw "WIN32_HANDLE_E2E_FAIL" }
          Write-Output "H454_NATIVE_WIN32_SYNTHETIC=PASS"
      - name: Compile native relay gate and verify owner/device fail closed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'h454-native-relay-ts'
          npm exec --yes --package=typescript@5.9.3 -- tsc --strict --target ES2022 --module commonjs --skipLibCheck --outDir $out deploy/h15/hermes-native-read-gate.template.ts
          if ($LASTEXITCODE -ne 0) { throw 'NATIVE_RELAY_TYPESCRIPT_COMPILE_FAILED' }
          $module = Join-Path $out 'hermes-native-read-gate.template.js'
          if (-not (Test-Path -LiteralPath $module)) { throw 'NATIVE_GATE_OUTPUT_MISSING' }
          $nodeTest = @'
          const assert = require('node:assert/strict');
          const a = require(process.argv[1]);
          delete process.env.HERMES_NATIVE_READ_DEVICE_ID;
          assert.equal(a.originalWindowsReadToolCatalog().length, 0);
          process.env.HERMES_NATIVE_READ_DEVICE_ID = 'h15-native-readonly-1234';
          assert.equal(a.originalWindowsReadToolCatalog().length, 2);
          const d = { deviceId: 'h15-native-readonly-1234', name: 'H15 Windows native read-only', platform: 'win32' };
          const tools = [{name:'native_file_read'},{name:'native_file_stat'},{name:'native_file_list'}];
          assert.equal(a.isNativeOriginalDevice(d.deviceId, true, d, tools), true);
          assert.equal(a.isNativeOriginalDevice(d.deviceId, false, d, tools), false);
          assert.equal(a.isNativeOriginalDevice(d.deviceId, true, d, [...tools,{name:'start_process'}]), false);
          assert.equal(a.isNativeOriginalReadRequest('native_file_read', {project:'hermes',relative:'README.md'}), true);
          assert.equal(a.isNativeOriginalReadRequest('native_file_read', {project:'hermes',relative:'..\\private.md'}), false);
          console.log('H454_RELAY_NATIVE_DEVICE_GATE=PASS');
          '@
          node -e $nodeTest $module
          if ($LASTEXITCODE -ne 0) { throw 'NATIVE_GATE_RUNTIME_FAILED' }
      - name: Recheck owner scope and negative request contract
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -B -m unittest -v tests.test_h15_native_windows_read tests.test_native_windows_policy tests.test_h15_native_windows_mcp_stdio tests.test_h15_native_windows_outbound tests.test_h15_native_windows_relay_contract tests.test_h15_brc_native_read_gate_patch tests.test_h15_native_windows_list
          if ($LASTEXITCODE -ne 0) { throw "NATIVE_READ_CONTRACT_FAIL" }
          Write-Output "H454_OWNER_SCOPE_CONTRACT=PASS"
