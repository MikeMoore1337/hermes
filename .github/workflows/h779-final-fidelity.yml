name: H779 final fidelity verification (temporary)
on:
  push:
    branches: [feat/h779-apple27-aero-glass]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: true, fetch-depth: 1}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: control_center/frontend/package-lock.json
      - name: Install and build existing React frontend
        working-directory: control_center/frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm run test
          npm run build
      - name: Sync only static Vite files to task branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feat/h779-apple27-aero-glass"
          git add -A control_center/web/
          if git diff --cached --quiet; then
            echo "STATIC_BUILD=SYNCED" >> "$GITHUB_STEP_SUMMARY"
          else
            test -z "$(git diff --cached --name-only | grep -v '^control_center/web/' || true)"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build(ui): sync H779 final keyboard and tablet fidelity assets'
            git push origin "HEAD:$GITHUB_REF"
            echo "STATIC_BUILD_COMMITTED=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Pinned Playwright browser
        working-directory: control_center/frontend
        run: npx playwright install --with-deps chromium
      - name: Verify exact approved geometry, keyboard and Inbox
        working-directory: control_center/frontend
        env:
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_HTML_OUTPUT_DIR: .artifacts/h779-final-fidelity
        run: npm run test:e2e -- apple27-fidelity.spec.js skip-link.spec.js operator-inbox.spec.js --reporter=html --workers=1
      - name: Capture browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h779-final-fidelity-evidence
          path: |
            control_center/frontend/.artifacts/h779-final-fidelity/
            control_center/frontend/.artifacts/playwright-results/
          if-no-files-found: warn
          retention-days: 7
