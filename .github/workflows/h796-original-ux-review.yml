name: H796 UX original methods - isolated design review
on:
  push:
    branches: [fix/h796-wide-apple-login]
permissions: {contents: read}
jobs:
  impeccable:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Native original Impeccable Operate context and concept
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/pbakaus/impeccable.git "$RUNNER_TEMP/impeccable"
          git -C "$RUNNER_TEMP/impeccable" checkout --detach 83dc1bbe4c37636632e72a7752e9cc433e9a9901
          test "$(git -C "$RUNNER_TEMP/impeccable" rev-parse HEAD)" = 83dc1bbe4c37636632e72a7752e9cc433e9a9901
          export IMPECCABLE_HOME="$RUNNER_TEMP/h796-engine"
          skill="$RUNNER_TEMP/impeccable/.agents/skills/impeccable/scripts/impeccable"
          cd control_center/frontend
          sh "$skill" engine-probe
          sh "$skill" context --target src/OrbitLogin.jsx
          sh "$skill" concept-seed --scope direction --mode operate
          echo "IMPECCABLE_NATIVE_DESIGN=PASS 83dc1bbe4c37636632e72a7752e9cc433e9a9901" >> "$GITHUB_STEP_SUMMARY"
  taste:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - name: Native original Taste direction and layout draw
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/Leonxlnx/taste-skill.git "$RUNNER_TEMP/taste"
          git -C "$RUNNER_TEMP/taste" checkout --detach 9b4bf937a1f69348126959c15d2f99a73e65699b
          test "$(git -C "$RUNNER_TEMP/taste" rev-parse HEAD)" = 9b4bf937a1f69348126959c15d2f99a73e65699b
          skill="$RUNNER_TEMP/taste/skills/taste-skill"
          node "$skill/scripts/start.mjs" deal --page software --history "$RUNNER_TEMP/h796-taste.json"
          node "$skill/assets/layout/deal.mjs" --type software --has ui --history "$RUNNER_TEMP/h796-layout.json"
          echo "TASTE_NATIVE_DESIGN=PASS 9b4bf937a1f69348126959c15d2f99a73e65699b" >> "$GITHUB_STEP_SUMMARY"
  pro-max:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Native original UI UX Pro Max design-system and responsive UX
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/nextlevelbuilder/ui-ux-pro-max-skill.git "$RUNNER_TEMP/pro"
          git -C "$RUNNER_TEMP/pro" checkout --detach ccce51cba388476d4f403091ddb91636d5cd9fed
          test "$(git -C "$RUNNER_TEMP/pro" rev-parse HEAD)" = ccce51cba388476d4f403091ddb91636d5cd9fed
          search="$RUNNER_TEMP/pro/.claude/skills/ui-ux-pro-max/scripts/search.py"
          python "$search" 'Apple macOS control center operator dashboard wide screen and dark login' --design-system --variance 3 --motion 2 --density 7 -p 'Hermes Aero Glass 27'
          python "$search" 'responsive wide screen fluid dashboard navigation' --domain ux
          python "$search" 'header theme toggle overlapping access label keyboard dark login' --domain ux
          python "$search" 'responsive react dashboard width and header controls' --stack react
          echo "PRO_MAX_NATIVE_DESIGN=PASS ccce51cba388476d4f403091ddb91636d5cd9fed" >> "$GITHUB_STEP_SUMMARY"
