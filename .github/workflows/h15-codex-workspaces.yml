name: H15 Codex and project workspace scripts (source-only)

on:
  pull_request:
    paths:
      - deploy/h15/codex-hermes-mcp.ps1
      - deploy/h15/windows-project-workspaces.ps1
      - docs/operations/H15-CODEX-PROJECT-WORKSPACES.md
      - tests/test_h15_codex_workspaces.py
      - .github/workflows/h15-codex-workspaces.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Contract tests without owner credentials
        run: python3 -m unittest discover -s tests -p 'test_h15_codex_workspaces.py' -v

  ps51-parser:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: PowerShell 5.1 parser only (no user actions)
        shell: powershell
        run: |
          $paths = @('deploy/h15/codex-hermes-mcp.ps1', 'deploy/h15/windows-project-workspaces.ps1')
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$path\: $($errors[0].Message)" }
          }
          Write-Host 'H15_CODEX_WINDOWS_PS51_PARSER=PASS'
