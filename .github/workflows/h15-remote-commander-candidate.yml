      - tests/test_h15_brc_patch_dependencies.py
      - tests/test_h15_brc_runtime_perl_base.py
      - deploy/h15/Dockerfile.brc-relay
      - tests/test_h15_brc_trivy_review.py
      - deploy/h15/Dockerfile.brc-relay
      - deploy/h15/stage-relay.sh
      - deploy/h15/load-verified-image.sh
      - tests/test_h15_remote_commander_candidate_audit.py
      - tests/test_h15_brc_apply_policy_patch.py
      - tests/test_h15_brc_harden_relay.py
      - tests/test_h15_brc_harden_gateway.py
      - tests/test_h15_brc_harden_reconnect.py
      - tests/test_h15_brc_harden_browser_csrf.py
      - tests/test_h15_brc_oci_relay_contract.py
      - tests/test_h15_brc_oci_receipt.py
      - tests/test_h15_brc_offline_stage.py
      - tests/test_h15_brc_offline_image_bundle.py
      - tests/test_h15_brc_os_inventory.py
      - docs/operations/H-15-SELFHOSTED-REMOTE-MCP.md
      - .github/workflows/h15-remote-commander-candidate.yml

permissions:
  contents: read

jobs:
  candidate:
    # Never run external source alongside fork PR secrets or credentials.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout Hermes, never persist repository credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Offline fail-closed Hermes security gate regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_h15_remote_commander_candidate_audit tests.test_h15_brc_apply_policy_patch tests.test_h15_brc_harden_relay tests.test_h15_brc_harden_gateway tests.test_h15_brc_harden_reconnect tests.test_h15_brc_harden_browser_csrf tests.test_h15_brc_oci_relay_contract tests.test_h15_brc_oci_receipt tests.test_h15_brc_offline_stage tests.test_h15_brc_offline_image_bundle tests.test_h15_brc_owner_deploy tests.test_h15_brc_release_approval

      - name: Workspace resolver and gateway negative contracts (offline)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_h15_workspace_router tests.test_h15_brc_workspace_gateway tests.test_h15_brc_upgrade_preflight tests.test_h15_brc_transactional_upgrade tests.test_h15_brc_owner_artifact_stage tests.test_h15_brc_owner_handoff tests.test_h15_brc_native_read_gateway tests.test_h15_native_windows_relay_contract tests.test_h454_brc_native_three_tool_cutover

      - name: WSS relay watchdog failure and recovery contract
        run: node scripts/h454_wss_relay_watchdog_e2e.mjs

      - name: Second SSH key no-overwrite and revocation contract
        run: sudo -n python3 -B -m unittest -v tests.test_h454_relay_second_authorized_key

      - name: Fetch exact upstream Git commit (not tag, latest or npm install)
        shell: bash
        run: |
          set -euo pipefail
          upstream="$RUNNER_TEMP/brc-upstream"
          mkdir -p "$upstream"
          git -C "$upstream" init -q
          git -C "$upstream" remote add origin https://github.com/shahidx0x/better-remote-commander.git
          git -C "$upstream" fetch --no-tags --depth=1 origin cbe511702dd0147650353c29ac6ab1decd8afda1
          git -C "$upstream" checkout -q --detach FETCH_HEAD
          test "$(git -C "$upstream" rev-parse HEAD)" = cbe511702dd0147650353c29ac6ab1decd8afda1
          echo "UPSTREAM_SOURCE_PIN=PASS"

      - name: Fail-closed provenance, license, full-tool inventory, known policy risks
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/h15_remote_commander_candidate_audit.py \
            --source-dir "$RUNNER_TEMP/brc-upstream" \
            | tee "$RUNNER_TEMP/brc-audit.json"
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["production_ready"] is False and r["live_execution"] == "DENIED"; print("LIVE_REMOTE_COMMAND_EXECUTION=DENIED")' "$RUNNER_TEMP/brc-audit.json"

      - name: Node runtime pinned to major line for disposable upstream E2E
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Build and exercise actual upstream relay, OAuth, multi-device and agent tests
        shell: bash
        working-directory: ${{ runner.temp }}/brc-upstream
        run: |
          set -euo pipefail
          npm install --global pnpm@11.24.0
          pnpm --version
          pnpm install --frozen-lockfile
          pnpm build
          pnpm test
          echo "UPSTREAM_ISOLATED_E2E=PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "PRODUCTION_ACTIVATION=NOT_EXECUTED" >> "$GITHUB_STEP_SUMMARY"

      - name: Test the already-paired Windows agent variant without activating it
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/brc-upstream"
          bundle="$RUNNER_TEMP/h454-no-auto-pair"
          python3 -m unittest tests.test_h454_agent_no_auto_pair
          test "$(sha256sum "$source/packages/agent/dist/cli.js" | cut -d' ' -f1)" = 1e38c5947075db3b3401a861ba8239b18ca511b958da5563470bf3b8f3acd416
          test "$(sha256sum "$source/packages/agent/dist/cli.js.map" | cut -d' ' -f1)" = a6fe8dda33fa0ede5facb7a1130cefc7e2ffc266738a0da71c0a8e7adca07456
          python3 -m scripts.h454_agent_no_auto_pair --source-dir "$source"
          (cd "$source" && pnpm --filter brc-agent build)
          test "$(sha256sum "$source/packages/agent/dist/cli.js" | cut -d' ' -f1)" = 348866e527fe862ce15aeaf82c217de158e880fcf8df5d219339027488462252
          test "$(sha256sum "$source/packages/agent/dist/cli.js.map" | cut -d' ' -f1)" = 7ee049973509eaed4a2e6aac57204e43b946a87bec4f8824b4e5ff6af07b8328
          node "$GITHUB_WORKSPACE/scripts/h454_agent_no_auto_pair_e2e.mjs" "$source/packages/agent"
          mkdir -p "$bundle"
          cp "$source/packages/agent/src/cli.ts" "$bundle/cli.ts"
          cp "$source/packages/agent/dist/cli.js" "$bundle/cli.js"
          cp "$source/packages/agent/dist/cli.js.map" "$bundle/cli.js.map"
          printf '%s\n' cbe511702dd0147650353c29ac6ab1decd8afda1 > "$bundle/UPSTREAM_SHA"
          printf '%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' > "$bundle/HERMES_HEAD_SHA"
          (cd "$bundle" && sha256sum cli.ts cli.js cli.js.map UPSTREAM_SHA HERMES_HEAD_SHA > SHA256SUMS && sha256sum -c SHA256SUMS)
          git -C "$source" show HEAD:packages/agent/src/cli.ts > "$RUNNER_TEMP/h454-original-cli.ts"
          mv "$RUNNER_TEMP/h454-original-cli.ts" "$source/packages/agent/src/cli.ts"
          git -C "$source" diff --exit-code -- packages/agent/src/cli.ts
          (cd "$source" && pnpm --filter brc-agent build)
          test "$(sha256sum "$source/packages/agent/dist/cli.js" | cut -d' ' -f1)" = 1e38c5947075db3b3401a861ba8239b18ca511b958da5563470bf3b8f3acd416
          test "$(sha256sum "$source/packages/agent/dist/cli.js.map" | cut -d' ' -f1)" = a6fe8dda33fa0ede5facb7a1130cefc7e2ffc266738a0da71c0a8e7adca07456
          echo "H454_NO_AUTO_PAIR_VARIANT=TESTED_NOT_ACTIVATED" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve the source-only Windows agent variant
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: h454-agent-no-auto-pair
          path: ${{ runner.temp }}/h454-no-auto-pair/
          if-no-files-found: error
          retention-days: 14

      - name: Compile the pinned WSS-only agent variant (not activated)
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/brc-upstream"
          bundle="$RUNNER_TEMP/h454-pinned-wss"
          python3 -m unittest tests.test_h454_agent_pinned_wss tests.test_h454_relay_authorized_keys
          python3 -m scripts.h454_agent_pinned_wss --source-dir "$source"
          (cd "$source" && pnpm --filter brc-agent build)
          mkdir -p "$bundle"
          cp "$source/packages/agent/src/transport/ws-client.ts" "$bundle/ws-client.ts"
          cp "$source/packages/agent/dist/transport/ws-client.js" "$bundle/ws-client.js"
          cp "$source/packages/agent/dist/transport/ws-client.js.map" "$bundle/ws-client.js.map"
          printf '%s\n' cbe511702dd0147650353c29ac6ab1decd8afda1 > "$bundle/UPSTREAM_SHA"
          printf '%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' > "$bundle/HERMES_HEAD_SHA"
          (cd "$bundle" && sha256sum ws-client.ts ws-client.js ws-client.js.map UPSTREAM_SHA HERMES_HEAD_SHA > SHA256SUMS)
          git -C "$source" show HEAD:packages/agent/src/transport/ws-client.ts > "$RUNNER_TEMP/h454-original-ws-client.ts"
          mv "$RUNNER_TEMP/h454-original-ws-client.ts" "$source/packages/agent/src/transport/ws-client.ts"
          git -C "$source" diff --exit-code -- packages/agent/src/transport/ws-client.ts
          (cd "$source" && pnpm --filter brc-agent build)

      - name: Preserve source-only WSS agent variant
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: h454-agent-pinned-wss
          path: ${{ runner.temp }}/h454-pinned-wss/
          if-no-files-found: error
          retention-days: 14

      - name: Harden pinned relay WSS to reject URL query bearer tokens
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.h15_brc_harden_relay \
            --source-dir "$RUNNER_TEMP/brc-upstream"

      - name: Enforce immutable MCP allowlist independently in pinned relay
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.h15_brc_harden_gateway \
            --source-dir "$RUNNER_TEMP/brc-upstream"

      - name: Add owner-scoped Hermes project discovery on the pinned relay (source only)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.h15_brc_workspace_gateway \
            --source-dir "$RUNNER_TEMP/brc-upstream" \
            --registry deploy/h15/workspace-registry.json
          test "$(git -C "$RUNNER_TEMP/brc-upstream" rev-parse HEAD)" = cbe511702dd0147650353c29ac6ab1decd8afda1
          echo "H15_WORKSPACE_MCP_PATCH=PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Add isolated original Windows read-only MCP route to pinned relay (offline candidate only)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.h15_brc_native_read_gateway --source-dir "$RUNNER_TEMP/brc-upstream"
          test "$(git -C "$RUNNER_TEMP/brc-upstream" rev-parse HEAD)" = cbe511702dd0147650353c29ac6ab1decd8afda1
          grep -q 'invokeOwnerNativeRead' "$RUNNER_TEMP/brc-upstream/packages/relay/src/mcp/server.ts"
          echo "H454_NATIVE_READ_RELAY_PATCH=SOURCE_ONLY" >> "$GITHUB_STEP_SUMMARY"

      - name: Patch owner-only relay local observation (disabled without private marker)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_h15_brc_observer_gateway
          python3 -m scripts.h15_brc_observer_gateway --source-dir "$RUNNER_TEMP/brc-upstream"
          test "$(git -C "$RUNNER_TEMP/brc-upstream" rev-parse HEAD)" = cbe511702dd0147650353c29ac6ab1decd8afda1
          echo "H455_OBSERVER_PATCH=SOURCE_ONLY" >> "$GITHUB_STEP_SUMMARY"

      - name: Fix stale/foreign WebSocket result replay at source-pinned relay DeviceHub
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.h15_brc_harden_reconnect \
            --source-dir "$RUNNER_TEMP/brc-upstream"

      - name: Apply exact-pinned owner browser CSRF origin guard
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.h15_brc_harden_browser_csrf \
            --source-dir "$RUNNER_TEMP/brc-upstream"

      - name: Apply Hermes policy to exact pinned agent (never production)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.h15_brc_apply_policy_patch \
            --source-dir "$RUNNER_TEMP/brc-upstream"
          test "$(git -C "$RUNNER_TEMP/brc-upstream" rev-parse HEAD)" = cbe511702dd0147650353c29ac6ab1decd8afda1

      - name: Patch pinned vulnerable BRC dependencies (disposable source only)
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/brc-upstream"
          python3 -m scripts.h15_brc_patch_dependencies --source-dir "$source"
          (
            cd "$source"
            # Regenerate from exact verified upstream; retain a frozen lock thereafter.
            pnpm install --no-frozen-lockfile
            pnpm install --frozen-lockfile
          )
          python3 -m scripts.h15_brc_patch_dependencies --source-dir "$source" --check-lock
          test "$(git -C "$source" rev-parse HEAD)" = cbe511702dd0147650353c29ac6ab1decd8afda1
          echo "H15_BRC_UPSTREAM_DEPENDENCY_OVERRIDES=PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "H15_BRC_DEPENDENCY_PATCH_PRODUCTION_APPROVED=NO" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify actual patched agent tool surface and denied paths
        shell: bash
        working-directory: ${{ runner.temp }}/brc-upstream
        run: |
          set -euo pipefail
          pnpm build
          # H454: verify the COMPILED native toolset, not only the Python/TS templates.
          node --input-type=module <<'JS'
          import { NATIVE_TOOLS } from './packages/relay/dist/mcp/hermes-native-read.js';
          const expected = ['native_file_stat', 'native_file_read', 'native_file_list'];
          const names = Array.isArray(NATIVE_TOOLS) ? NATIVE_TOOLS.map(t => t.name) : [];
          if (JSON.stringify(names) !== JSON.stringify(expected)) {
            throw Error('H454_COMPILED_NATIVE_TOOLSET_MISMATCH');
          }
          console.log('H454_COMPILED_NATIVE_TOOLSET_3=PASS');
          JS
          node "$GITHUB_WORKSPACE/scripts/h15_brc_observer_contract.mjs" "$RUNNER_TEMP/brc-upstream/packages/relay/dist/hermes-brc-observer.js"
          node --input-type=module <<'JS'
          import { listApprovedWorkspaces, resolveApprovedWorkspace } from './packages/relay/dist/mcp/hermes-workspaces.js';
          const dev = { name: 'H15 Windows permanent sandbox', deviceId: 'h15-win-05be75515428', online: true, paused: false };
          const assert = (value, name) => { if (!value) throw Error('H454_CI_FAIL:' + name); };
          assert(listApprovedWorkspaces([dev]).workspaces.length === 4, 'catalog');
          const yfc = resolveApprovedWorkspace({ project: 'YFC' }, [dev]);
          assert(yfc.status === 'resolved' && yfc.root === '/workspace/projects/your-fitness-coach', 'yfc');
          assert(yfc.git_verified === false && yfc.verification_required_before_write, 'no_false_git_verification');
          assert(resolveApprovedWorkspace({ project: 'toolkit' }, [dev]).workspace === 'ai-development-toolkit', 'toolkit');
          for (const input of [{ project: '../../private' }, { project: 'YFC', deviceId: 'forced' }, {}])
