            "$image" >/dev/null
          for i in $(seq 1 40); do
            if docker exec "$relay" node -e "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" >/dev/null 2>&1; then break; fi
            sleep 0.25
          done
          if [ "$(docker inspect --format '{{.State.Running}}' "$relay")" != "true" ]; then
            echo "H15_CI_RELAY_EXITED_BEFORE_HEALTH=true"
            docker logs --tail 30 "$relay" 2>&1
            docker inspect --format 'relay_state={{.State.Status}} exit_code={{.State.ExitCode}} oom={{.State.OOMKilled}}' "$relay"
            exit 1
          fi
          docker exec "$relay" node -e "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1))"
          token_json="$(docker exec "$relay" node /opt/brc/h15-ci-provision.mjs)"
          token_a="$(printf '%s' "$token_json" | python3 -c 'import json,sys;print(json.load(sys.stdin)["one"])')"
          token_b="$(printf '%s' "$token_json" | python3 -c 'import json,sys;print(json.load(sys.stdin)["two"])')"
          echo "::add-mask::$token_a"
          echo "::add-mask::$token_b"
          for name in "$agent_a" "$agent_b"; do
            if [ "$name" = "$agent_a" ]; then
              token="$token_a"; device="ci-native-one"; workspace="$workspace_a"; display_name="H15 Windows permanent sandbox"
            else
              token="$token_b"; device="ci-native-two"; workspace="$workspace_b"; display_name="ci-native-two"
            fi
            docker run -d --name "$name" --network "$net" \
              --read-only --user 65534:65534 --cap-drop ALL \
              --security-opt no-new-privileges \
              --pids-limit 64 --memory 512m --cpus 1 \
              --tmpfs /tmp:rw,nosuid,nodev,uid=65534,gid=65534,size=16m \
              -v "$workspace:/workspace:rw" \
              -e HOME=/workspace -e BRC_HOME=/workspace/.brc \
              -e BRC_RELAY=http://ci-relay:3000 \
              -e BRC_DEVICE_ID="$device" -e BRC_NAME="$display_name" \
              -e BRC_TOKEN="$token" \
              "$image" node packages/agent/dist/cli.js --allow-dir /workspace >/dev/null
          done
          docker exec "$relay" node /opt/brc/h15-ci-e2e.mjs
          for name in "$relay" "$agent_a" "$agent_b"; do
            test "$(docker inspect --format '{{.Config.User}}' "$name")" = "65534:65534"
            test "$(docker inspect --format '{{.HostConfig.Privileged}}' "$name")" = "false"
            test -z "$(docker port "$name")"
          done
          test "$(docker network inspect --format '{{.Internal}}' "$net")" = "true"
          echo "HERMES_BRC_TWO_NATIVE_OAUTH_MCP=PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "NATIVE_OWNERS_DEVICE_COMMAND_EXECUTION=NOT_ENABLED" >> "$GITHUB_STEP_SUMMARY"

      - name: Stage actual approved OCI relay offline, smoke and rollback (ephemeral CI)
        shell: bash
        run: |
          set -euo pipefail
          script="$GITHUB_WORKSPACE/deploy/h15/stage-relay.sh"
          bash -n "$script"
          image="hermes-brc-relay-eval:${GITHUB_SHA:0:12}"
          image_id="$(docker image inspect --format '{{.Id}}' "$image")"
          # Hard refuse mutable tags without modifying host Docker state.
          if sudo bash "$script" preflight "$image" >/dev/null 2>&1; then
            echo 'H15_STAGE_ACCEPTED_MUTABLE_TAG' >&2
            exit 1
          fi
          sudo bash "$script" preflight "$image_id"
          cleanup() { sudo bash "$script" rollback >/dev/null || true; }
          trap cleanup EXIT
          sudo bash "$script" status | grep -Fx 'H15_STAGE_STATUS=NOT_INSTALLED'
          sudo bash "$script" start "$image_id"
          sudo bash "$script" smoke
          sudo bash "$script" status | grep -Fx 'H15_STAGE_STATUS=running'
          test -z "$(docker port hermes-brc-stage-h15)"
          test "$(docker inspect -f '{{.HostConfig.NetworkMode}}' hermes-brc-stage-h15)" = none
          sudo bash "$script" rollback
          sudo bash "$script" rollback
          sudo bash "$script" status | grep -Fx 'H15_STAGE_STATUS=NOT_INSTALLED'
          trap - EXIT
          echo 'H15_STAGE_OFFLINE_INSTALL_SMOKE_ROLLBACK=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'H15_STAGE_REAL_VPS_MODIFIED=NO' >> "$GITHUB_STEP_SUMMARY"

      - name: Immutable base + CycloneDX dependency SBOM + fail-closed OCI receipt
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/h15-brc-oci-evidence"
          mkdir -p "$evidence"
          image="hermes-brc-relay-eval:${GITHUB_SHA:0:12}"
          # Never publish an image in this evaluation workflow.
          cd "$RUNNER_TEMP/brc-upstream"
          pnpm sbom --sbom-format cyclonedx --lockfile-only --out "$evidence/sbom.cdx.json"
          docker image inspect "$image" > "$RUNNER_TEMP/oci-image-inspect.json"
          python3 "$GITHUB_WORKSPACE/scripts/h15_brc_oci_receipt.py" \
            --dockerfile "$GITHUB_WORKSPACE/deploy/h15/Dockerfile.brc-relay" \
            --image-inspect "$RUNNER_TEMP/oci-image-inspect.json" \
            --sbom "$evidence/sbom.cdx.json" \
            --source-audit "$RUNNER_TEMP/brc-audit.json" \
            --git-sha "$GITHUB_SHA" \
            --out "$evidence/OCI_RECEIPT.json"
          cp "$RUNNER_TEMP/brc-audit.json" "$evidence/UPSTREAM_AUDIT.json"
          printf 'sha256:a5f4366e834695d5f363b920c104953a535d3a9864d1bdf74566a0ebe01daee5\n' > "$evidence/NODE_BASE_DIGEST"
          (
            cd "$evidence"
            sha256sum OCI_RECEIPT.json sbom.cdx.json UPSTREAM_AUDIT.json NODE_BASE_DIGEST > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          echo "HERMES_BRC_OCI_PINNED_BASE=PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "HERMES_BRC_OCI_CYCLONEDX_SBOM=PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "HERMES_BRC_OCI_RECEIPT=CI_IMAGE_VERIFIED_NOT_DEPLOYABLE" >> "$GITHUB_STEP_SUMMARY"

      - name: Observe actual OCI kernel scope and installed vulnerable-tool presence
        shell: bash
        run: |
          set -euo pipefail
          image="hermes-brc-relay-eval:${GITHUB_SHA:0:12}"
          evidence="$RUNNER_TEMP/h15-brc-oci-evidence"
          container="h15-surface-${GITHUB_RUN_ID}"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          # No binds, host mounts, user devices, secrets, network or ports.
          # Run the probe from stdin; it is never baked into the OCI image.
          docker create --interactive --name "$container" \
            --network none --read-only --user 65534:65534 \
            --cap-drop ALL --security-opt no-new-privileges \
            --memory 256m --pids-limit 32 --entrypoint node \
            "$image" --input-type=commonjs - >/dev/null
          docker start --attach --interactive "$container" \
            < "$GITHUB_WORKSPACE/scripts/h15_brc_image_runtime_surface.cjs" \
            > "$evidence/runtime-surface.raw.json"
          docker inspect "$container" > "$RUNNER_TEMP/h15-surface-container-inspect.json"
          python3 "$GITHUB_WORKSPACE/scripts/h15_brc_image_runtime_surface.py" \
            --probe "$evidence/runtime-surface.raw.json" \
            --inspect "$RUNNER_TEMP/h15-surface-container-inspect.json" \
            --out "$evidence/runtime-surface.json"
          (
            cd "$evidence"
            sha256sum OCI_RECEIPT.json sbom.cdx.json \
              runtime-surface.raw.json runtime-surface.json \
              UPSTREAM_AUDIT.json NODE_BASE_DIGEST > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          echo "H15_ACTUAL_OCI_KERNEL_SCOPE=CI_ISOLATED" >> "$GITHUB_STEP_SUMMARY"
          echo "H15_VULNERABLE_BINARY_PRESENCE=OBSERVED_NOT_WAIVED" >> "$GITHUB_STEP_SUMMARY"
          echo "H15_RUNTIME_RELEASE_GO=NO" >> "$GITHUB_STEP_SUMMARY"

      - name: Inventory built OCI Debian packages (no CVE clearance)
        shell: bash
        run: |
          set -euo pipefail
          image="hermes-brc-relay-eval:${GITHUB_SHA:0:12}"
          evidence="$RUNNER_TEMP/h15-brc-oci-evidence"
          test -d "$evidence"
          # Observe installed dpkg records from the ACTUAL built runtime image.
          # No network, ports, volumes, Docker socket, or owner host reads.
          docker run --rm --network none --read-only --user 65534:65534 \
            --cap-drop ALL --security-opt no-new-privileges \
            --memory 256m --pids-limit 32 --entrypoint dpkg-query \
            "$image" -W '-f=${Status}\t${Package}\t${Version}\t${Architecture}\n' |
            awk -F '\t' '$1 == "install ok installed" { print $2 "\t" $3 "\t" $4 }'             > "$RUNNER_TEMP/brc-runtime-dpkg.tsv"
          docker image inspect "$image" > "$RUNNER_TEMP/brc-runtime-os-inspect.json"
          python3 "$GITHUB_WORKSPACE/scripts/h15_brc_os_inventory.py" \
            --dpkg-list "$RUNNER_TEMP/brc-runtime-dpkg.tsv" \
            --docker-inspect "$RUNNER_TEMP/brc-runtime-os-inspect.json" \
            --output "$evidence/os-packages.cdx.json"
          (cd "$evidence" && \
            sha256sum OCI_RECEIPT.json sbom.cdx.json os-packages.cdx.json \
              runtime-surface.raw.json runtime-surface.json \
              UPSTREAM_AUDIT.json NODE_BASE_DIGEST > SHA256SUMS && \
            sha256sum --check SHA256SUMS)
          echo "H15_OS_VULNERABILITY_SCAN=NOT_PERFORMED" >> "$GITHUB_STEP_SUMMARY"
          echo "H15_OS_RELEASE_APPROVED=NO" >> "$GITHUB_STEP_SUMMARY"

      - name: Pin real local BRC image for read-only vulnerability scan
        shell: bash
        run: |
          set -euo pipefail
          image="hermes-brc-relay-eval:${GITHUB_SHA:0:12}"
          scan="hermes-brc-relay-scan:${GITHUB_SHA}"
          docker tag "$image" "$scan"
          test "$(docker image inspect --format '{{.Id}}' "$image")" = \
               "$(docker image inspect --format '{{.Id}}' "$scan")"

      - name: Scan actual built BRC OCI image with Trivy (CVE evidence only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hermes-brc-relay-scan:${{ github.sha }}
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          list-all-pkgs: 'true'
          format: json
          output: ${{ runner.temp }}/h15-brc-oci-evidence/trivy-image.json
          exit-code: '0'
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          cache: 'false'
          version: v0.70.0
          timeout: 10m

      - name: Validate image-bound vulnerability evidence (never automatic release GO)
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/h15-brc-oci-evidence"
          image="hermes-brc-relay-scan:${GITHUB_SHA}"
          test -s "$evidence/trivy-image.json"
          image_id="$(docker image inspect --format '{{.Id}}' "$image")"
          python3 "$GITHUB_WORKSPACE/scripts/h15_brc_trivy_review.py" \
            --report "$evidence/trivy-image.json" \
            --image-id "$image_id" \
            --output "$evidence/trivy-review.json"
          # Source-linked, non-approving triage of every HIGH/CRITICAL ID.
          # New IDs or changed source package scope remain explicitly INCOMPLETE.
          python3 "$GITHUB_WORKSPACE/scripts/h15_brc_cve_triage.py" \
            --report "$evidence/trivy-image.json" \
            --ledger "$GITHUB_WORKSPACE/docs/security/h15-brc-cve-dispositions.json" \
            --image-id "$image_id" \
            --output "$evidence/trivy-triage.json"
          (
            cd "$evidence"
            sha256sum OCI_RECEIPT.json sbom.cdx.json os-packages.cdx.json \
              trivy-image.json trivy-review.json trivy-triage.json \
              runtime-surface.raw.json runtime-surface.json \
              UPSTREAM_AUDIT.json NODE_BASE_DIGEST > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          echo "H15_TRIVY_IMAGE_SCAN_EVIDENCE=RECORDED" >> "$GITHUB_STEP_SUMMARY"
          echo "H15_TRIVY_PRODUCTION_GO=NO" >> "$GITHUB_STEP_SUMMARY"
          echo "H15_CVE_PRODUCTION_GO=NO" >> "$GITHUB_STEP_SUMMARY"
          # Restore the original exact-one-tag OCI transfer assumption.
          # The scanner alias is disposable and must not enter the export.
          docker image rm "hermes-brc-relay-scan:${GITHUB_SHA}" >/dev/null
          test "$(docker image inspect --format '{{json .RepoTags}}' \
            "hermes-brc-relay-eval:${GITHUB_SHA:0:12}")" = \
            "[\"hermes-brc-relay-eval:${GITHUB_SHA:0:12}\"]"

      - name: Retain isolated image provenance and CycloneDX SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: h15-brc-oci-source-and-sbom
          path: ${{ runner.temp }}/h15-brc-oci-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Export real vetted relay OCI image as independently pinned offline archive
        shell: bash
        run: |
          set -euo pipefail
          command -v zstd >/dev/null || { echo 'ZSTD_REQUIRED_FOR_FREE_OFFLINE_EXPORT'; exit 1; }
          image="hermes-brc-relay-eval:${GITHUB_SHA:0:12}"
          bundle="$RUNNER_TEMP/h15-brc-verified-offline-image"
          mkdir -p "$bundle"
          # The image passed all full OAuth/MCP, native two-device and sandbox
          # tests before this artifact can be created.
          image_id="$(docker image inspect --format '{{.Id}}' "$image")"
          test "$(docker image inspect --format '{{.Architecture}}' "$image")" = amd64
          cp "$RUNNER_TEMP/h15-brc-oci-evidence/OCI_RECEIPT.json" "$bundle/"
          cp "$RUNNER_TEMP/h15-brc-oci-evidence/sbom.cdx.json" "$bundle/"
          cp "$RUNNER_TEMP/h15-brc-oci-evidence/os-packages.cdx.json" "$bundle/"
          docker image inspect "$image" > "$RUNNER_TEMP/h15-brc-export-inspect.json"
          docker image save "$image" | zstd -T2 -3 -q -o "$bundle/brc-relay.docker.tar.zst"
          zstd -tq "$bundle/brc-relay.docker.tar.zst"
          python3 "$GITHUB_WORKSPACE/scripts/h15_brc_offline_image_bundle.py" build \
            --directory "$bundle" \
            --inspect "$RUNNER_TEMP/h15-brc-export-inspect.json"
          archive_sha="$(sha256sum "$bundle/brc-relay.docker.tar.zst" | awk '{print $1}')"
          bash "$GITHUB_WORKSPACE/deploy/h15/load-verified-image.sh" \
            verify "$bundle" "$archive_sha" "$image_id" "$GITHUB_SHA"
          (
            cd "$bundle"
            sha256sum brc-relay.docker.tar.zst OCI_RECEIPT.json sbom.cdx.json os-packages.cdx.json IMAGE_BUNDLE.json > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          # Verify the exported artifact is an actual loadable image, rather
          # than trusting only metadata or hashes of a non-working tar.
          docker image rm "$image" >/dev/null
          sudo bash "$GITHUB_WORKSPACE/deploy/h15/load-verified-image.sh" \
            load "$bundle" "$archive_sha" "$image_id" "$GITHUB_SHA"
          test "$(docker image inspect --format '{{.Id}}' "$image")" = "$image_id"
          # Rehearse staging again from the IMPORTED image, not just the build.
          script="$GITHUB_WORKSPACE/deploy/h15/stage-relay.sh"
          trap 'sudo bash "$script" rollback >/dev/null 2>&1 || true' EXIT
          sudo bash "$script" start "$image_id"
          sudo bash "$script" smoke
          sudo bash "$script" rollback
          trap - EXIT
          echo "H15_BRC_OFFLINE_IMAGE_EXPORT_IMPORT=PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "H15_BRC_OFFLINE_ARCHIVE_SHA256=$archive_sha" >> "$GITHUB_STEP_SUMMARY"
          echo "H15_BRC_OFFLINE_IMAGE_ID=$image_id" >> "$GITHUB_STEP_SUMMARY"
          echo "H15_BRC_OFFLINE_SOURCE_SHA=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "H15_BRC_OFFLINE_IMAGE_PLATFORM=linux/amd64" >> "$GITHUB_STEP_SUMMARY"
          echo "H15_BRC_OFFLINE_IMAGE_OWNER_VPS_MODIFIED=NO" >> "$GITHUB_STEP_SUMMARY"

      - name: Real disposable Docker relay upgrade, rollback, SQLite restore and device reconnect
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/scripts/h15_brc_transactional_docker_e2e.sh"
          echo "H454_REAL_DOCKER_OWNER_CUTOVER_CI=PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "H454_OWNER_VPS_MODIFIED=NO" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish sealed OCI transfer archive for optional owner offline stage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: h15-brc-relay-offline-oci-amd64
          path: ${{ runner.temp }}/h15-brc-verified-offline-image/
          if-no-files-found: error
          retention-days: 3

      - name: Build verified offline patch bundle for an owner-maintained MIT fork
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/brc-upstream"
          bundle="$RUNNER_TEMP/hermes-brc-pinned-source"
          replay="$RUNNER_TEMP/brc-replay"
          mkdir -p "$bundle"
          # Include every generated, untracked owner extension in this replayable patch.
          git -C "$candidate" add -N \
            packages/relay/src/hermes-brc-observer.ts \
            packages/relay/src/mcp/hermes-policy.ts \
            packages/relay/src/mcp/hermes-tool-catalog.ts \
            packages/relay/src/mcp/hermes-workspaces.ts \
            packages/relay/src/mcp/hermes-native-read.ts
          git -C "$candidate" diff --check HEAD
          git -C "$candidate" diff --binary HEAD > "$bundle/hermes-brc.patch"
          test -s "$bundle/hermes-brc.patch"
          cat > "$bundle/EXPECTED_PATHS.txt" <<'PATHS'
          packages/agent/src/core/handlers/search-handlers.ts
          packages/agent/src/core/search-manager.ts
          packages/agent/src/core/terminal-manager.ts
          packages/agent/src/core/tools/edit.ts
          packages/agent/src/core/tools/filesystem.ts
          packages/agent/src/core/tools/improved-process-tools.ts
          packages/agent/src/core/types.ts
          packages/agent/src/dispatcher.ts
          packages/relay/src/app.ts
          packages/relay/src/device-hub.ts
          packages/relay/src/hermes-brc-observer.ts
          packages/relay/src/mcp/hermes-native-read.ts
          packages/relay/src/mcp/hermes-policy.ts
          packages/relay/src/mcp/hermes-tool-catalog.ts
          packages/relay/src/mcp/hermes-workspaces.ts
          packages/relay/src/mcp/invoke.ts
          packages/relay/src/mcp/server.ts
          pnpm-lock.yaml
          pnpm-workspace.yaml
          scripts/e2e-admin.mjs
          scripts/e2e-all.mjs
          scripts/e2e-oauth.mjs
          PATHS
          git -C "$candidate" diff --name-only HEAD | diff -u "$bundle/EXPECTED_PATHS.txt" -
          cp "$candidate/LICENSE" "$candidate/NOTICE" "$bundle/"
          cp "$RUNNER_TEMP/brc-audit.json" "$bundle/PROVENANCE.json"
          printf 'cbe511702dd0147650353c29ac6ab1decd8afda1\n' > "$bundle/UPSTREAM_SHA"
          # A fresh, detached, separate worktree proves the exact distributed
          # patch can be reapplied to the immutable MIT upstream checkout.
          git -C "$candidate" worktree add --detach "$replay" cbe511702dd0147650353c29ac6ab1decd8afda1
          git -C "$replay" apply --check "$bundle/hermes-brc.patch"
          git -C "$replay" apply "$bundle/hermes-brc.patch"
          git -C "$replay" add -N \
            packages/relay/src/hermes-brc-observer.ts \
            packages/relay/src/mcp/hermes-policy.ts \
            packages/relay/src/mcp/hermes-tool-catalog.ts \
            packages/relay/src/mcp/hermes-workspaces.ts \
            packages/relay/src/mcp/hermes-native-read.ts
          git -C "$replay" diff --check HEAD
          git -C "$replay" diff --binary HEAD > "$RUNNER_TEMP/replayed-brc.patch"
          cmp "$bundle/hermes-brc.patch" "$RUNNER_TEMP/replayed-brc.patch"
          (
            cd "$bundle"
            sha256sum EXPECTED_PATHS.txt hermes-brc.patch LICENSE NOTICE PROVENANCE.json UPSTREAM_SHA > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          echo "HERMES_BRC_REPRODUCIBLE_PATCH_BUNDLE=PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "HERMES_BRC_PATCH_SHA256=$(sha256sum "$bundle/hermes-brc.patch" | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "BUNDLE_PRODUCTION_EXECUTION=NOT_ENABLED" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve owner-selfhosted MIT fork patch artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: h15-brc-selfhosted-fork-source
          path: ${{ runner.temp }}/hermes-brc-pinned-source/
          if-no-files-found: error
          retention-days: 14

      - name: Retain sanitized source audit receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: h15-remote-commander-source-audit
          path: ${{ runner.temp }}/brc-audit.json
          if-no-files-found: ignore
          retention-days: 7
