name: H-15 pinned Remote Commander candidate (isolated CI only)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/h15_remote_commander_candidate_audit.py
      - scripts/h15_brc_apply_policy_patch.py
      - scripts/h15_brc_harden_relay.py
      - scripts/h15_brc_harden_gateway.py
      - scripts/h15_brc_harden_reconnect.py
      - scripts/h15_brc_reconnect_socket_e2e.mjs
      - scripts/h15_brc_harden_browser_csrf.py
      - scripts/h15_brc_browser_csrf_e2e.mjs
      - scripts/h15_brc_gateway_policy_e2e.mjs
      - scripts/h15_brc_relay_ws_e2e.mjs
      - scripts/h15_brc_two_wss_agents_e2e.mjs
      - scripts/h15_brc_sandbox_linux_e2e.mjs
      - scripts/h15_brc_oci_relay_smoke.mjs
      - scripts/h15_brc_oci_receipt.py
      - deploy/h15/Dockerfile.brc-relay
      - tests/test_h15_remote_commander_candidate_audit.py
      - tests/test_h15_brc_apply_policy_patch.py
      - tests/test_h15_brc_harden_relay.py
      - tests/test_h15_brc_harden_gateway.py
      - tests/test_h15_brc_harden_reconnect.py
      - tests/test_h15_brc_harden_browser_csrf.py
      - tests/test_h15_brc_oci_relay_contract.py
      - tests/test_h15_brc_oci_receipt.py
      - docs/operations/H-15-SELFHOSTED-REMOTE-MCP.md
      - .github/workflows/h15-remote-commander-candidate.yml

permissions:
  contents: read

jobs:
  candidate:
    # Never run external source alongside fork PR secrets or credentials.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout Hermes, never persist repository credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Offline fail-closed Hermes security gate regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_h15_remote_commander_candidate_audit tests.test_h15_brc_apply_policy_patch tests.test_h15_brc_harden_relay tests.test_h15_brc_harden_gateway tests.test_h15_brc_harden_reconnect tests.test_h15_brc_harden_browser_csrf tests.test_h15_brc_oci_relay_contract tests.test_h15_brc_oci_receipt

      - name: Fetch exact upstream Git commit (not tag, latest or npm install)
        shell: bash
        run: |
          set -euo pipefail
          upstream="$RUNNER_TEMP/brc-upstream"
          mkdir -p "$upstream"
          git -C "$upstream" init -q
          git -C "$upstream" remote add origin https://github.com/shahidx0x/better-remote-commander.git
          git -C "$upstream" fetch --no-tags --depth=1 origin cbe511702dd0147650353c29ac6ab1decd8afda1
          git -C "$upstream" checkout -q --detach FETCH_HEAD
          test "$(git -C "$upstream" rev-parse HEAD)" = cbe511702dd0147650353c29ac6ab1decd8afda1
          echo "UPSTREAM_SOURCE_PIN=PASS"

      - name: Fail-closed provenance, license, full-tool inventory, known policy risks
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/h15_remote_commander_candidate_audit.py \
            --source-dir "$RUNNER_TEMP/brc-upstream" \
            | tee "$RUNNER_TEMP/brc-audit.json"
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["production_ready"] is False and r["live_execution"] == "DENIED"; print("LIVE_REMOTE_COMMAND_EXECUTION=DENIED")' "$RUNNER_TEMP/brc-audit.json"

      - name: Node runtime pinned to major line for disposable upstream E2E
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Build and exercise actual upstream relay, OAuth, multi-device and agent tests
        shell: bash
        working-directory: ${{ runner.temp }}/brc-upstream
        run: |
          set -euo pipefail
          npm install --global pnpm@11.24.0
          pnpm --version
          pnpm install --frozen-lockfile
          pnpm build
          pnpm test
          echo "UPSTREAM_ISOLATED_E2E=PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "PRODUCTION_ACTIVATION=NOT_EXECUTED" >> "$GITHUB_STEP_SUMMARY"

      - name: Harden pinned relay WSS to reject URL query bearer tokens
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.h15_brc_harden_relay \
            --source-dir "$RUNNER_TEMP/brc-upstream"

      - name: Enforce immutable MCP allowlist independently in pinned relay
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.h15_brc_harden_gateway \
            --source-dir "$RUNNER_TEMP/brc-upstream"

      - name: Fix stale/foreign WebSocket result replay at source-pinned relay DeviceHub
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.h15_brc_harden_reconnect \
            --source-dir "$RUNNER_TEMP/brc-upstream"

      - name: Apply exact-pinned owner browser CSRF origin guard
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.h15_brc_harden_browser_csrf \
            --source-dir "$RUNNER_TEMP/brc-upstream"

      - name: Apply Hermes policy to exact pinned agent (never production)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.h15_brc_apply_policy_patch \
            --source-dir "$RUNNER_TEMP/brc-upstream"
          test "$(git -C "$RUNNER_TEMP/brc-upstream" rev-parse HEAD)" = cbe511702dd0147650353c29ac6ab1decd8afda1

      - name: Verify actual patched agent tool surface and denied paths
        shell: bash
        working-directory: ${{ runner.temp }}/brc-upstream
        run: |
          set -euo pipefail
          pnpm build
          node "$GITHUB_WORKSPACE/scripts/h15_brc_relay_ws_e2e.mjs"
          node "$GITHUB_WORKSPACE/scripts/h15_brc_two_wss_agents_e2e.mjs"
          node "$GITHUB_WORKSPACE/scripts/h15_brc_gateway_policy_e2e.mjs"
          node "$GITHUB_WORKSPACE/scripts/h15_brc_reconnect_socket_e2e.mjs"
          node "$GITHUB_WORKSPACE/scripts/h15_brc_browser_csrf_e2e.mjs"
          node --input-type=module <<'JS'
          import { listTools, hasTool, callTool } from './packages/agent/dist/dispatcher.js';
          const denied = ['get_config', 'get_recent_tool_calls',
                          'set_config_value', 'prepare_file_transfer',
                          'send_file_transfer', 'receive_file_transfer'];
          const advertised = new Set(listTools().map((tool) => tool.name));
          for (const tool of denied) {
            if (hasTool(tool) || advertised.has(tool)) throw Error('POLICY_BYPASS:' + tool);
            const result = await callTool(tool, {});
            if (!result.isError) throw Error('DENIED_TOOL_EXECUTED:' + tool);
          }
          if (!hasTool('start_process') || !hasTool('write_file')) {
            throw Error('MANDATORY_COMPATIBLE_TOOL_MISSING');
          }
          const result = await callTool('read_file', {
            path: 'https://example.invalid/', isUrl: true
          });
          if (!result.isError || !JSON.stringify(result).includes('HERMES_REMOTE_URL_FETCH_DENIED')) {
            throw Error('EXTERNAL_URL_READ_ALLOWED');
          }
          console.log('HERMES_PATCHED_DISPATCHER=PASS');
          JS
          pnpm test
          echo "HERMES_PATCHED_MCP_POLICY=PASS (source-only, no live agent)" >> "$GITHUB_STEP_SUMMARY"
          echo "HERMES_PINNED_WSS_BEARER_ONLY=PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "HERMES_PINNED_BROWSER_CSRF=PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Real native Linux sandbox denial with patched file and shell tools
        shell: bash
        run: |
          set -euo pipefail
          workspace="$RUNNER_TEMP/brc-owner-approved-test-workspace"
          mkdir -p "$workspace"
          chmod 0777 "$workspace"
          # A real host-only canary. Not mounted into the sandbox container.
          printf 'never-expose-this-host-fixture' > "$RUNNER_TEMP/brc-owner-secret"
          chmod 0600 "$RUNNER_TEMP/brc-owner-secret"
          docker run --rm --pull=missing \
            --network none --read-only \
            --user 65534:65534 --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 64 --memory 512m --cpus 1 \
            --tmpfs /tmp:rw,nosuid,nodev,size=16m \
            -e HOME=/workspace/home -e BRC_HOME=/workspace/home/.brc \
            -v "$RUNNER_TEMP/brc-upstream:/opt/brc:ro" \
            -v "$workspace:/workspace:rw" \
            -v "$GITHUB_WORKSPACE/scripts/h15_brc_sandbox_linux_e2e.mjs:/e2e/run.mjs:ro" \
            -w /workspace \
            node:24-bookworm-slim node /e2e/run.mjs
          echo "HERMES_BRC_LINUX_OS_SANDBOX=PASS (disposable CI only)" >> "$GITHUB_STEP_SUMMARY"

      - name: Build real hardened BRC relay OCI image and test least-privilege deployment shape
        shell: bash
        run: |
          set -euo pipefail
          image="hermes-brc-relay-eval:${GITHUB_SHA:0:12}"
          docker build --pull --progress=plain \
            --file "$GITHUB_WORKSPACE/deploy/h15/Dockerfile.brc-relay" \
            --tag "$image" "$RUNNER_TEMP/brc-upstream"
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = "65534:65534"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = "cbe511702dd0147650353c29ac6ab1decd8afda1"
          container="h15-brc-smoke-${GITHUB_RUN_ID}"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          admin_secret="$(openssl rand -hex 32)"
          cookie_secret="$(openssl rand -hex 32)"
          docker run --detach --name "$container" \
            --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --user 65534:65534 \
            --memory 768m --cpus 1 --pids-limit 100 \
            --tmpfs /state:rw,nosuid,nodev,uid=65534,gid=65534,size=64m \
            --tmpfs /tmp:rw,nosuid,nodev,uid=65534,gid=65534,size=16m \
            --env BRC_ADMIN_PASSWORD="$admin_secret" \
            --env BRC_SESSION_SECRET="$cookie_secret" \
            --volume "$GITHUB_WORKSPACE/scripts/h15_brc_oci_relay_smoke.mjs:/opt/brc/oci-relay-smoke.mjs:ro" \
            "$image" >/dev/null
          docker exec "$container" node /opt/brc/oci-relay-smoke.mjs
          # Strictly no published host ports and no outbound network.
          test -z "$(docker port "$container")"
          test "$(docker inspect --format '{{.HostConfig.NetworkMode}}' "$container")" = "none"
          image_id="$(docker image inspect --format '{{.Id}}' "$image")"
          echo "HERMES_BRC_RELAY_OCI_TEST_IMAGE_ID=$image_id" >> "$GITHUB_STEP_SUMMARY"
          echo "HERMES_BRC_RELAY_OCI_NONROOT_E2E=PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "OCI_PUBLIC_PORTS=NONE" >> "$GITHUB_STEP_SUMMARY"
          echo "OCI_PRODUCTION_DEPLOY=NOT_EXECUTED" >> "$GITHUB_STEP_SUMMARY"

      - name: Immutable base + CycloneDX dependency SBOM + fail-closed OCI receipt
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/h15-brc-oci-evidence"
          mkdir -p "$evidence"
          image="hermes-brc-relay-eval:${GITHUB_SHA:0:12}"
          # Never publish an image in this evaluation workflow.
          cd "$RUNNER_TEMP/brc-upstream"
          pnpm sbom --sbom-format cyclonedx --lockfile-only --out "$evidence/sbom.cdx.json"
          docker image inspect "$image" > "$RUNNER_TEMP/oci-image-inspect.json"
          python3 "$GITHUB_WORKSPACE/scripts/h15_brc_oci_receipt.py" \
            --dockerfile "$GITHUB_WORKSPACE/deploy/h15/Dockerfile.brc-relay" \
            --image-inspect "$RUNNER_TEMP/oci-image-inspect.json" \
            --sbom "$evidence/sbom.cdx.json" \
            --source-audit "$RUNNER_TEMP/brc-audit.json" \
            --git-sha "$GITHUB_SHA" \
            --out "$evidence/OCI_RECEIPT.json"
          cp "$RUNNER_TEMP/brc-audit.json" "$evidence/UPSTREAM_AUDIT.json"
          printf 'sha256:a5f4366e834695d5f363b920c104953a535d3a9864d1bdf74566a0ebe01daee5\n' > "$evidence/NODE_BASE_DIGEST"
          (
            cd "$evidence"
            sha256sum OCI_RECEIPT.json sbom.cdx.json UPSTREAM_AUDIT.json NODE_BASE_DIGEST > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          echo "HERMES_BRC_OCI_PINNED_BASE=PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "HERMES_BRC_OCI_CYCLONEDX_SBOM=PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "HERMES_BRC_OCI_RECEIPT=CI_IMAGE_VERIFIED_NOT_DEPLOYABLE" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain isolated image provenance and CycloneDX SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: h15-brc-oci-source-and-sbom
          path: ${{ runner.temp }}/h15-brc-oci-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Build verified offline patch bundle for an owner-maintained MIT fork
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/brc-upstream"
          bundle="$RUNNER_TEMP/hermes-brc-pinned-source"
          replay="$RUNNER_TEMP/brc-replay"
          mkdir -p "$bundle"
          # Include the newly added gateway policy file in git diff.
          git -C "$candidate" add -N packages/relay/src/mcp/hermes-policy.ts
          git -C "$candidate" diff --check HEAD
          git -C "$candidate" diff --binary HEAD > "$bundle/hermes-brc.patch"
          test -s "$bundle/hermes-brc.patch"
          cat > "$bundle/EXPECTED_PATHS.txt" <<'PATHS'
          packages/agent/src/dispatcher.ts
          packages/relay/src/device-hub.ts
          packages/relay/src/app.ts
          packages/relay/src/mcp/hermes-policy.ts
          packages/relay/src/mcp/invoke.ts
          packages/relay/src/mcp/server.ts
          scripts/e2e-admin.mjs
          scripts/e2e-all.mjs
          scripts/e2e-oauth.mjs
          PATHS
          git -C "$candidate" diff --name-only HEAD | diff -u "$bundle/EXPECTED_PATHS.txt" -
          cp "$candidate/LICENSE" "$candidate/NOTICE" "$bundle/"
          cp "$RUNNER_TEMP/brc-audit.json" "$bundle/PROVENANCE.json"
          printf 'cbe511702dd0147650353c29ac6ab1decd8afda1\n' > "$bundle/UPSTREAM_SHA"
          # A fresh, detached, separate worktree proves the exact distributed
          # patch can be reapplied to the immutable MIT upstream checkout.
          git -C "$candidate" worktree add --detach "$replay" cbe511702dd0147650353c29ac6ab1decd8afda1
          git -C "$replay" apply --check "$bundle/hermes-brc.patch"
          git -C "$replay" apply "$bundle/hermes-brc.patch"
          git -C "$replay" add -N packages/relay/src/mcp/hermes-policy.ts
          git -C "$replay" diff --check HEAD
          git -C "$replay" diff --binary HEAD > "$RUNNER_TEMP/replayed-brc.patch"
          cmp "$bundle/hermes-brc.patch" "$RUNNER_TEMP/replayed-brc.patch"
          (
            cd "$bundle"
            sha256sum EXPECTED_PATHS.txt hermes-brc.patch LICENSE NOTICE PROVENANCE.json UPSTREAM_SHA > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          echo "HERMES_BRC_REPRODUCIBLE_PATCH_BUNDLE=PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "HERMES_BRC_PATCH_SHA256=$(sha256sum "$bundle/hermes-brc.patch" | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "BUNDLE_PRODUCTION_EXECUTION=NOT_ENABLED" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve owner-selfhosted MIT fork patch artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: h15-brc-selfhosted-fork-source
          path: ${{ runner.temp }}/hermes-brc-pinned-source/
          if-no-files-found: error
          retention-days: 14

      - name: Retain sanitized source audit receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: h15-remote-commander-source-audit
          path: ${{ runner.temp }}/brc-audit.json
          if-no-files-found: ignore
          retention-days: 7
