      - name: Build real hardened BRC relay OCI image and test least-privilege deployment shape
        shell: bash
        run: |
          set -euo pipefail
          image="hermes-brc-relay-eval:${GITHUB_SHA:0:12}"
          docker build --pull --progress=plain \
            --file "$GITHUB_WORKSPACE/deploy/h15/Dockerfile.brc-relay" \
            --tag "$image" "$RUNNER_TEMP/brc-upstream"
          # Read the ACTUAL image's dpkg database, not the runner host.
          # No network, privileges, host mounts or writable paths.
          package="$(docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 65534:65534 \
            --memory 128m --pids-limit 32 --entrypoint dpkg-query \
            "$image" -W '-f=${Version}' perl-base)"
          test "$package" = "5.36.0-7+deb12u4"
          echo "H15_RUNTIME_PERL_BASE_FIXED_VERSION=PASS" >> "$GITHUB_STEP_SUMMARY"
          # BRC runtime does not need npm/npx (and npm's bundled undici).
          # Prove the non-root Node interpreter and upgraded sharp native module
          # remain usable inside the ACTUAL built image, with no network/mounts.
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 65534:65534 \
            --memory 256m --pids-limit 32 \
            --workdir /opt/brc/packages/agent --entrypoint node "$image" \
            -e '
              const fs = require("node:fs");
              if (fs.existsSync("/usr/local/lib/node_modules/npm")) process.exit(2);
              if (fs.existsSync("/usr/local/bin/npm") || fs.existsSync("/usr/local/bin/npx")) process.exit(3);
              const sharp = require("sharp");
              sharp({ create: { width: 1, height: 1, channels: 3, background: "#ffffff" } })
                .png().toBuffer()
                .then(buffer => { if (!Buffer.isBuffer(buffer) || buffer.length < 20) process.exit(4); })
                .catch(() => process.exit(5));
            '
          # H454: a successful source CI is insufficient. Probe the ACTUAL OCI
          # before publishing/staging it; a stale two-tool image must fail CI.
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 65534:65534 \
            --memory 256m --pids-limit 32 \
            --entrypoint node "$image" --input-type=module -e '
              import { NATIVE_TOOLS } from "/opt/brc/packages/relay/dist/mcp/hermes-native-read.js";
              const expected = ["native_file_stat", "native_file_read", "native_file_list"];
              const names = Array.isArray(NATIVE_TOOLS) ? NATIVE_TOOLS.map(t => t.name) : [];
              if (JSON.stringify(names) !== JSON.stringify(expected)) {
                throw Error("H454_OCI_NATIVE_TOOLSET_MISMATCH");
              }
              console.log("H454_OCI_NATIVE_TOOLSET_3=PASS");
            '
          echo "H454_OCI_NATIVE_TOOLSET_3=PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "H15_RELAY_RUNTIME_NPM_REMOVED=PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "H15_RELAY_RUNTIME_SHARP_NATIVE=PASS" >> "$GITHUB_STEP_SUMMARY"
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = "65534:65534"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = "cbe511702dd0147650353c29ac6ab1decd8afda1"
          container="h15-brc-smoke-${GITHUB_RUN_ID}"
