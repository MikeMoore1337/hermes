  <path d="M1012 98 L1103 151 L1103 257 L1012 310 L921 257 L921 151 Z" fill="url(#plate)" stroke="url(#accent)" stroke-width="2.5"/>
  <path d="M1012 115 L1087 159 L1087 249 L1012 293 L937 249 L937 159 Z" fill="none" stroke="#7EA9EB" stroke-opacity=".23" stroke-width="1"/>
  <path d="M976 172 V237 M1049 172 V237 M976 204 H1049" stroke="#EAF8FF" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1012" cy="204" r="7" fill="#60EAE6"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4" text-anchor="middle">
    <g><circle cx="857" cy="95" r="32" fill="#17273E" stroke="#56DAD7" stroke-width="1.5"/><path d="M845 96 L853 104 L868 86" stroke="#56E9DB" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="857" y="146" fill="#B3C7DC">OPS</text></g>
    <g><circle cx="1178" cy="105" r="32" fill="#1D2345" stroke="#AE92FF" stroke-width="1.5"/><path d="M1166 114 L1173 91 L1180 104 L1187 91 L1193 114" stroke="#C2AEFF" fill="none" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><text x="1178" y="156" fill="#BDC2E8">RESEARCH</text></g>
    <g><circle cx="1183" cy="302" r="32" fill="#17273E" stroke="#56DAD7" stroke-width="1.5"/><rect x="1170" y="292" width="26" height="21" rx="4" fill="none" stroke="#56E9DB" stroke-width="2.5"/><path d="M1175 299 H1191 M1175 305 H1186" stroke="#56E9DB" stroke-width="2"/><text x="1183" y="354" fill="#B3C7DC">QUALITY</text></g>
    <g><circle cx="840" cy="314" r="32" fill="#1D2345" stroke="#AE92FF" stroke-width="1.5"/><path d="M830 317 L838 307 L845 313 L854 301" stroke="#C2AEFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="840" y="366" fill="#BDC2E8">CONTROL</text></g>
