# Install only on the YFC tunnel after verifying the existing units and state.
# While the tunnel is active, retry the native service if a dependency failure
# or another interruption left it inactive. systemd's native start limits apply.
# To deliberately keep the native service stopped, first remove this drop-in
# and run daemon-reload; disabling the native unit alone does not stop Upholds.
[Unit]
Upholds=hermes-commander-native.service
